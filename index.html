  <li>用 <code>sleep</code> 写"下载 → 分析 → 入库"三步顺序流程，每步打印时间戳（用 <code>Date.now()</code>），确认是顺序执行的。</li>
  <li>把其中一个 <code>await</code> 删掉再跑，观察输出顺序怎么乱掉——理解 <code>await</code> 到底管住了什么。</li>
</ol>

<h3 id="ts-s8"><div class="section-head">2 · Promise：代表"未来值"的对象 <button class="done-btn" data-section="ts-s8">标记完成</button></div></h3>

<p>上一节你已经在用 Promise 了——<code>sleep(300)</code> 返回的就是它，<code>await</code> 等的就是它。本节把它讲透：<strong>Promise 是一个对象，代表一个"现在还没有、将来才会有（或者失败）"的结果。</strong>它是异步体系里传递"未来的值"的载体：异步函数之间交接结果、做并发编排、加超时和取消，全靠它。</p>

<h4>① 是什么：一台三态的状态机</h4>
<div class="pre-wrap"><pre data-lang="text"><code>                 ┌──────────┐
   创建 ───────→ │ pending  │  进行中
                 └────┬─────┘
                      │（只迁移一次，不可逆）
          ┌───────────┴────────────┐
          ▼                        ▼
     fulfilled                rejected
   （成功，带一个值）       （失败，带一个原因）</code></pre></div>
<p>两条铁律：</p>
<ol>
  <li><strong>状态只迁移一次，且不可逆。</strong>fulfilled 之后不会再变成 rejected，反之亦然。</li>
  <li><strong>已落定（settled）的 Promise，结果会被缓存。</strong>再 await 立即拿到，不重新执行任何东西。</li>
</ol>
<div class="pre-wrap"><pre data-playground><code>const p = new Promise((resolve) =&gt; setTimeout(() =&gt; resolve(42), 300));
// 此刻 p 是 pending

const v = await p;                    // 等到 fulfilled，v = 42
console.log("第一次 await:", v);
console.log("再 await 一次:", await p);  // 立即返回 42——结果被缓存，没有再等 300ms</code></pre></div>

<h4>② await 的操作语义：机械的 4 步</h4>
<p><code>const x = await expr;</code> 到底发生了什么：</p>
<ol>
  <li><strong>求值 expr</strong> 得到值 v。如果 v 不是 Promise，先包一层 <code>Promise.resolve(v)</code>（所以 <code>await 42</code> 也合法）。</li>
  <li><strong>暂停当前 async 函数</strong>：把"await 之后的全部剩余代码"打包成续体（continuation），注册到 v 上，控制权交还给事件循环。</li>
  <li><strong>事件循环去跑别的任务</strong>，直到 v 落定。</li>
  <li><strong>按结局恢复</strong>：v fulfilled → 从暂停处恢复，表达式的值就是结果；v rejected → 在 await 这一点<strong>抛出异常</strong>（所以 try/catch 能接）。</li>
</ol>
<div class="pre-wrap"><pre data-playground><code>// 精确细节：await 即使等一个【已完成】的 Promise，也会让出一次
async function f() {
  console.log("A: f 开始");
  await Promise.resolve("x");   // 已 fulfilled，照理"不用等"
  console.log("C: f 恢复");
}
console.log("1: 调用前");
f();
console.log("2: 调用后同步代码");
// 输出：1, A, 2, C —— C 排在 2 后面！
// await 点之后的代码，一定排在当前这轮同步代码之后</code></pre></div>

<h4>③ 追问：await 交出了主动权，为什么后面的代码还是按顺序执行？</h4>
<p>因为 <strong>await 交出的是线程的使用权，不是自己代码的执行顺序</strong>。暂停时，"之后的代码"被打包成续体挂在 Promise 上——<strong>Promise 不落定，续体就不会跑</strong>。函数内部的顺序由续体链严格保证：</p>
<div class="pre-wrap"><pre><code>await ticker;                       // ticker 不落定 ↓
console.log("[最终]: " + text);     // ← 这行就不可能执行
// "最终"是 await ticker 的续体：不是"碰巧"最后打印，
// 是 ticker 的 Promise fulfilled 之后，它才有资格被排上队</code></pre></div>
<p>那"让出"到底让出了什么？<strong>让出的是线程</strong>——冻结期间线程去跑别的任务。交错只发生在<strong>不同任务之间</strong>；每个任务内部顺序纹丝不动。第 3 节的心跳 demo 会让你看到两根任务进度条的交错。</p>
<div class="callout key">
  <strong>推论：想判断你的代码何时执行，只需数它前面有几个 await、各自在等什么 Promise</strong>——顺序信息全在代码里，没有隐藏的并发陷阱。
</div>

<h4>④ .then 与 catch：await 底下的机制（读懂即可）</h4>
<p><code>.then(onOk)</code> / <code>.catch(onErr)</code> / <code>.finally(cb)</code> 是注册"落定后调用"的回调，返回新 Promise 所以能链式。老代码和库里常见，<strong>能读懂即可，新代码一律用 await</strong>：线性可读、错误处理统一走 try/catch。</p>
<div class="pre-wrap"><pre><code>// 同一件事的两种写法
const v1 = await fetchData();                      // await 风格（推荐）
fetchData().then((v2) =&gt; console.log(v2));          // then 风格（读懂即可）

// 对应关系：try/catch ≈ then/catch
try { await risky(); } catch (e) { /* 处理失败 */ }
risky().then(ok).catch((e) => { /* 同一个位置 */ });</code></pre></div>

<h4>⑤ 怎么得到一个 Promise</h4>
<ol>
  <li><strong>现代异步 API 直接返回 Promise</strong>：<code>fetch()</code>、<code>fs.promises.readFile()</code>……拿来就 await，这是最常见的情况。</li>
  <li><strong>调用任何 async 函数</strong>，返回值一定是 Promise。注意它是"热的"——<strong>函数体立即执行到第一个 await</strong>（第 1 节⑤），不存在"await 了才开始跑"的惰性语义。</li>
  <li><strong>自己包装回调风格的老 API</strong>：用 <code>new Promise(executor)</code>，见下面小节。</li>
</ol>

<h4>Promise 是怎么造出来的：executor 与 resolve（r 是什么）</h4>
<p><code>new Promise((r) =&gt; setTimeout(r, ms))</code>——<code>r</code> 是什么、从哪来？<code>new Promise(executor)</code> 的构造器接收你写的函数（术语叫 <strong>executor</strong>），<strong>立即同步调用它</strong>，并把两个由 Promise 内部创建的函数传进去，约定叫 <code>resolve</code> 和 <code>reject</code>（<code>r</code> 只是 resolve 的简写变量名，叫什么都行）。<strong>你不是创造 r，你是接收 r。</strong></p>
<div class="pre-wrap"><pre data-playground><code>// Promise ≈ 一个"未来值的盒子"，executor 是你往盒子里装东西的机会
const p = new Promise((resolve, reject) =&gt; {
  setTimeout(() =&gt; resolve("叮"), 300);  // 300ms 后把 "叮" 放进盒子 → fulfilled
  // reject(new Error("坏了"));          // 若走这条 → rejected，await 处抛异常
});
const v = await p;
console.log(v);      // "叮"

// 为什么 setTimeout(r, 500) 能直接传 r？
// "到时调用 fn()" 和 resolve 的调用签名恰好兼容（多传的参数被忽略）
await new Promise((r) =&gt; setTimeout(r, 500));
console.log("至少 500ms 过去了");</code></pre></div>
<div class="callout key">
  <strong>什么时候需要手写 new Promise？</strong>只有把<strong>回调风格的老 API</strong>（setTimeout、事件监听、Node 回调）包装成可 await 的形式时。
  现代 API（fetch、fs/promises）直接返回 Promise，不用自己包。所以 <code>new Promise</code> 高频出现在"胶水层"，业务代码里少见。
</div>

<h4>⑥ 组合器：并发编排的四件套</h4>
<table>
  <tr><th>组合器</th><th>语义</th><th>什么时候用</th></tr>
  <tr><td><code>Promise.all</code></td><td>全部成功才成功；一个失败立即整体失败</td><td>任务缺一不可：批量下载，少一个就没法继续</td></tr>
  <tr><td><code>Promise.allSettled</code></td><td>等全部结束，成败都收集成数组</td><td>允许部分失败：分析 100 个素材，失败的记下来继续</td></tr>
  <tr><td><code>Promise.race</code></td><td>谁先<strong>落定</strong>用谁（含失败）</td><td>超时控制</td></tr>
  <tr><td><code>Promise.any</code></td><td>谁先<strong>成功</strong>用谁；全败才失败</td><td>多个镜像源取最快的那个</td></tr>
</table>
<p>亲手感受并发——三个任务一起出发，总耗时 ≈ 最慢的一个：</p>
<div class="pre-wrap"><pre data-playground><code>const delay = (ms) =&gt; new Promise((r) =&gt; setTimeout(r, ms));

async function download(name, ms) {
  console.log(name, "开始下载");
  await delay(ms);              // ← 让出控制权，事件循环去跑别的任务
  console.log(name, "下载完成");
}

console.log("=== 并发启动三个下载 ===");
await Promise.all([
  download("kick.wav", 500),
  download("snare.wav", 200),
  download("hihat.wav", 800),
]);
console.log("=== 全部完成 ===");

// 观察输出顺序：开始是启动顺序，完成是耗时顺序（snare 最先完成）
// 这就是并发：三个任务交替推进，等待时间重叠
// 再把 Promise.all 换成 for...of 逐个 await，对比总耗时</code></pre></div>
<p>实用模式——用 <code>race</code> 给任何 Promise 加超时：</p>
<div class="pre-wrap"><pre data-playground><code>function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) =&gt; setTimeout(() =&gt; reject(new Error("超时")), ms)),
  ]);
}

const slowTask = new Promise((r) =&gt; setTimeout(() =&gt; r("慢任务完成"), 2000));
try {
  console.log(await withTimeout(slowTask, 500));
} catch (e) {
  console.log("捕获:", e.message);   // 500ms 时超时先落定 → "捕获: 超时"
}</code></pre></div>
<div class="callout warn">
  <strong>单位坑：</strong><code>setTimeout</code> 的延迟参数是<strong>毫秒</strong>（1995 年 Netscape 的历史），<code>setTimeout(r, 1)</code> 只等 1 毫秒。JS 里时间 API 几乎都是毫秒（<code>Date.now()</code>、<code>performance.now()</code>）；音频领域例外：<strong>Web Audio 的 <code>AudioContext.currentTime</code> 是秒</strong>，写音频代码时特别小心。
  另外这个数值是<strong>最少等待</strong>不是精确等待：定时器到点只负责把任务排进队列，事件循环被占时会推迟（下一节讲队列）。
</div>

<h4>⑦ 什么时候用 Promise，什么时候不用</h4>
<p><strong>用：</strong></p>
<ul>
  <li>一切 I/O：网络请求、文件读写、定时器、子进程、LLM 流式响应——等待期间事件循环可以去干别的。</li>
  <li>需要并发编排时：多个 I/O 任务并行、超时、竞速、取消。</li>
  <li>需要把"未来的值"当对象传递时：存进数组、挂到对象上、多处 await 共享同一个结果。</li>
</ul>
<p><strong>不用：</strong></p>
<ul>
  <li><strong>CPU 密集计算。</strong><code>await</code> 不会让计算让出线程——10 秒的傅里叶变换照样冻结页面 10 秒（下一节解释为什么）。这种活交给 Worker，不是 Promise。</li>
  <li><strong>纯线性同步流程。</strong>几件本来就瞬间完成的事，直接写同步代码，包 Promise 只是噪音。</li>
</ul>

<h4>⑧ 三个高频错误</h4>
<ol>
  <li><strong>忘记 await。</strong>拿到的是一个 Promise 对象而不是结果；<code>if (promise)</code> 恒为真（对象是真值）。类型系统能抓大部分，但逻辑错误抓不到。pi 里 <code>void runAgentLoop(...)</code> 的 <code>void</code> 前缀是"我故意不 await"的显式声明。</li>
  <li><strong>forEach 里 await 不等待。</strong><code>items.forEach(async ...)</code> 立即返回、任务并发飞出没人收尸——第 3 节有实测。</li>
  <li><strong>以为 Promise "被 await 才开始"。</strong>创建即执行（热启动），await 只是等结果。两个任务想并发，先都创建出来再 await；写一个 await 一个就是串行。</li>
</ol>

<h3 id="ts-s7b"><div class="section-head">3 · 底下的机制：事件循环、协程与生成器 <button class="done-btn" data-section="ts-s7b">标记完成</button></div></h3>

<p>第 1、2 节你学会了"怎么用"。这一节掀开盖子：await 暂停之后<strong>到底是谁在调度</strong>？为什么计算会卡死页面？为什么说"async 函数是可以暂停的函数"是精确描述？</p>

<h4>① 先立词汇：串行 / 并发 / 并行 × 同步 / 异步</h4>
<p>这几个词容易混淆，因为它们不在同一根轴上：</p>
<table>
  <tr><th>概念</th><th>含义</th><th>类比（餐厅）</th></tr>
  <tr><td><strong>串行</strong></td><td>做完一件再做下一件</td><td>一个服务员，服务完一桌才理下一桌</td></tr>
  <tr><td><strong>并发 concurrency</strong></td><td>多个任务交替推进，同一时刻只干一件</td><td>一个服务员，在几桌之间来回跑</td></tr>
  <tr><td><strong>并行 parallelism</strong></td><td>多个任务同一时刻真的同时跑</td><td>多个服务员同时干活</td></tr>
</table>
<ul>
  <li><strong>串行 / 并发 / 并行</strong> 描述的是"<strong>任务怎么被调度推进</strong>"（结构问题）。</li>
  <li><strong>同步 / 异步</strong> 描述的是"<strong>等待结果时让不让出执行权</strong>"（机制问题）。</li>
</ul>
<p>关系是：<strong>异步是实现并发的一种机制</strong>——单线程也能并发，靠"等 I/O 时切换任务"（这个切换机制叫事件循环，下一小节讲）。但并发不只有异步一条路：多线程也能并发（操作系统抢占式切换）。而并行是另一回事：需要多核硬件，是"真的同时"。Rob Pike 的经典表述：</p>
<div class="callout">
  <strong>Concurrency is about dealing with lots of things at once. Parallelism is about doing lots of things at once.</strong><br>
  并发是"同时应对很多事"（结构），并行是"同时做很多事"（执行）。并行天然是并发，并发不一定是并行。
</div>
<div class="callout key">
  <strong>async 是并发模型，不是并行。</strong>它只有一条线程在跑代码，靠"等待时切换任务"挤出来的时间。
  想真正利用多核 CPU（比如音频 DSP 批量渲染），async 帮不了你，那是多进程/Worker 的领域。
</div>

<h4>② 事件循环：一个永不停歇的调度员</h4>
<p>异步的运行机制叫<strong>事件循环（event loop）</strong>，心智模型就三条：</p>
<ol>
  <li>只有<strong>一条线程</strong>执行你的代码，外面挂着一个任务队列。</li>
  <li>一个任务一旦开始跑，<strong>只有跑到 <code>await</code> 才主动让出</strong>控制权（术语：协作式调度）。调度员绝不会在代码中途抢控制权。</li>
  <li><code>await</code> 让出后，调度员从队列里挑下一个能跑的任务（比如某个网络响应到达了）；你的 I/O 完成后，你的任务被排回队列，轮到后从 <code>await</code> 的下一行继续。</li>
</ol>
<div class="callout warn">
  <strong>推论（生产事故的常客）：任何长时间的纯计算都会卡死整个程序。</strong>
  因为没人让出控制权，其他所有任务（包括 UI 响应！）全部饿死。JS 里一个 10 秒的 while 循环 = 页面冻结 10 秒。
</div>
<p>把 JS 的运行机制放进这个模型，一张表看清：</p>
<table>
  <tr><th>机制</th><th>并发？</th><th>并行？</th><th>切换方式</th></tr>
  <tr><td>JS <code>async/await</code></td><td>✓</td><td>✗（单线程）</td><td>协作式：只在 <code>await</code> 点切换</td></tr>
  <tr><td>JS Web Worker / Node worker_threads</td><td>✓</td><td><strong>✓</strong></td><td>OS 调度</td></tr>
</table>

<h4>可视化：两个 async 函数的事件循环现场（单步演示）</h4>
<p>这段代码有两个 async 函数同时活跃——一个等定时器（宏任务），一个等已完成的 Promise（微任务）。用下面的单步器一格一格走，<strong>看清 await 暂停时到底在干什么：函数挂起、续体进队列、线程去跑别的、落定后恢复</strong>：</p>
<div class="pre-wrap"><pre><code>async function download() {          // 任务 A
  console.log("A: 开始下载");
  await sleep(500);                  // 挂起；注册 500ms 定时器（宏任务）
  console.log("A: 下载完成");         // ← 续体
}
async function parse() {             // 任务 B
  console.log("B: 开始解析");
  await Promise.resolve();           // 挂起；Promise 已完成，续体直接进微任务队列
  console.log("B: 解析完成");         // ← 续体
}
download();
parse();
console.log("C: 同步代码结束");</code></pre></div>
<div id="evl-viz"></div>
<div class="callout key">
  <strong>走完回答三个问题：</strong>① 为什么 C 在两个函数完成之前打印？② 为什么 B 的完成排在 A 前面（微任务 vs 宏任务的优先级）？
  ③ await 那一刻，这个函数到底处于什么状态？（答：函数被冻结在 await 点，剩余部分作为续体排在队列里，线程已经不属于它了。）
</div>

<h4>③ 交错执行的证据：心跳实验</h4>
<p>"事件循环在等待时去跑别的任务"——别停留在字面上，跑这个实验亲眼看：</p>
<div class="pre-wrap"><pre data-playground><code>const t0 = Date.now();
const el = () => ((Date.now() - t0) / 1000).toFixed(1) + "s";

async function slowTask() {
  console.log("[" + el() + "] 慢任务开始，要等 1.2s");
  await new Promise((r) =&gt; setTimeout(r, 1200));
  console.log("[" + el() + "] 慢任务结束");
}

// 同一个事件循环上同时跑一个心跳任务
const ticker = (async () => {
  for (let i = 1; i &lt;= 4; i++) {
    await new Promise((r) =&gt; setTimeout(r, 250));
    console.log("  [" + el() + "] 心跳 " + i + "：慢任务等待期间，别的事照常在跑");
  }
})();

await slowTask();
await ticker;
// 输出：心跳 1-4 穿插在"慢任务开始"和"慢任务结束"之间——
// 慢任务的 1.2s 等待被心跳"免费"利用了。这就是"不阻塞"。</code></pre></div>

<h4>④ yield：会"暂停"的函数（生成器）</h4>
<p>普通函数一旦调用就跑到 return 为止，中间停不下来。生成器（<code>yield</code>）打破这一点：<strong>每次 yield 就是一次"暂停并交出控制权"，下次被催时从暂停处继续</strong>。</p>
<div class="pre-wrap"><pre data-playground><code>function* task() {
  console.log("第 1 步");
  yield;
  console.log("第 2 步");
  yield;
  console.log("第 3 步");
}
const t = task();  // 什么都不打印！生成器只是被创建
console.log("创建完毕");
t.next();          // 打印"第 1 步"
t.next();          // 打印"第 2 步"</code></pre></div>
<p>注意：<strong>调用生成器函数不会执行函数体</strong>，只造出一个"待驱动"的对象；由外部（<code>next()</code> 或 <code>for</code> 循环）一步一步驱动。<strong>生成器同时也是迭代器</strong>（实现了第 1 课第 8 节的迭代器协议），所以能被 <code>for...of</code> 和 <code>[...展开]</code> 直接消费：</p>
<div class="pre-wrap"><pre data-playground><code>// 生成器产出值：fibonacci
function* fibonacci(n) {
  let a = 0, b = 1;
  for (let i = 0; i &lt; n; i++) {
    yield a;
    [a, b] = [b, a + b];   // 解构交换
  }
}
console.log([...fibonacci(10)]);   // 展开收集所有 yield 的值</code></pre></div>

<h4>⑤ 从 yield 到 await：协程就是"被事件循环驱动的生成器"</h4>
<p>这是理解一切的关键一步。<strong>async 函数 ≈ 一种特殊的生成器：<code>await</code> 就是它的"yield 点"，但驱动它的不是 <code>next()</code>，而是事件循环。</strong></p>
<div class="pre-wrap"><pre data-lang="text"><code>生成器：  function* → 在 yield 暂停 → 外部 next() 驱动继续
协程：    async function → 在 await 暂停 → 事件循环在 Promise 落定后驱动继续</code></pre></div>
<p>这不是比喻：早期的协程实现就是在生成器机制上长出来的，后来才有了 <code>async/await</code> 专用语法。所以"async 函数 = 可以在 await 点暂停的函数"是精确描述，不是粗略类比。</p>

<h4>⑥ async 函数的三个关键事实</h4>
<div class="pre-wrap"><pre data-playground><code>// 事实 1：async 函数调用后【立即执行到第一个 await】才暂停
async function f() {
  console.log("我开始执行了");   // f() 一调用就打印
  await new Promise((r) =&gt; setTimeout(r, 500));
  console.log("我醒来了");
}
f();  // 立即看到"我开始执行了"

// 事实 2：事件循环永远在跑，不需要入口手续，顶层 await 合法
//（这个 Playground 就是这么实现的）

// 事实 3：async 函数总是返回 Promise（承诺对象）
const p = f();   // p 是一个 Promise：代表"未来会有一个结果"的承诺

// Promise 三态：pending（进行中）→ fulfilled（成功）/ rejected（失败）
// await p → 拿到结果；如果 rejected → await 处抛异常，用 try/catch 接</code></pre></div>

<h4>⑦ 推论区：机制讲完了，回头看这些结论</h4>
<div class="callout key">
  <strong>协作式切换送你一个礼物：await 点之间是"原子"的。</strong>
  两个 <code>await</code> 之间的同步代码绝不会被其他任务插入——因为调度员只在 await 点接手。
  这就是异步代码比多线程好写太多的原因（没有锁、没有数据竞争），也是第 3 课 agent loop 里直接 <code>context.messages.push(...)</code> 而不用任何锁的原因。
  反过来说：<strong>你的代码只会在 await 点被"打断"</strong>，排查并发问题时只看 await 的位置就够了。
</div>
<p><strong>追问：最底层看，并行 = 多核同时处理，单核最多并发？</strong>正确，加两个修正和一个注脚：</p>
<ol>
  <li><strong>并行通常是"同时处理多个任务"</strong>——单个任务想吃并行红利必须本身可拆分。批量渲染 100 个 wav 天然可拆（每核领一批）；"渲染一个 wav"能不能拆取决于算法。所以并行编程的核心难题是任务分解。</li>
  <li><strong>单核上的"交替"有两种实现</strong>：OS 时间片（抢占式，随时打断）vs 事件循环（协作式，只在 await 让出）——就是 ② 那张表里"切换方式"一列。</li>
</ol>
<p>底层注脚：单核内部其实有流水线/超标量/超线程等"小并行"，但那是硬件对指令流的透明优化，不改变编程模型。你的领域还有个重要例外：<strong>GPU</strong>——几千个小核，天生并行；可向量化的音频运算（卷积混响、FFT）放 GPU 上比开多进程高几个量级。</p>
<div class="callout key">
  <strong>一句话总结：</strong>单核只能并发（交替），多核才能并行（真同时）但任务要可拆分；
  异步的价值与核数无关——它回收的是"等 I/O"的时间，那段时间 CPU 本来就在空转。
</div>

<div class="callout key">
  <strong>与 pi 的连接：</strong>LLM 流式响应（<code>for await</code> 消费）、工具并行执行（<code>Promise.all</code>）、API key 异步刷新、AbortSignal 取消——
  agent 框架的每一层都是 I/O 密集 + 事件循环。现在回头看第 3 课的 <code>streamAssistantResponse</code>，你应该能看懂它为什么全程 async 了。
</div>

<h3 id="ts-s8b"><div class="section-head">4 · for await 与异步迭代器：pi 流式架构的基础 <button class="done-btn" data-section="ts-s8b">标记完成</button></div></h3>

<h4>异步生成器：可以 await 的生成器</h4>
<p>生成器（第 3 节④）加上 <code>async</code>，就能在 <code>yield</code> 之间 <code>await</code>——产出值可以慢、可以等 I/O。消费它用 <code>for await</code>。这就是 LLM 流式输出的模型：</p>
<div class="pre-wrap"><pre data-playground><code>// 模拟 LLM 流式响应：异步生成器一块一块吐文本
async function* fakeLlmStream() {
  const chunks = ["你好", "，我是", " pi", "。"];
  for (const c of chunks) {
    await new Promise((r) =&gt; setTimeout(r, 300));  // 模拟网络延迟
    yield c;
  }
}

let text = "";
for await (const chunk of fakeLlmStream()) {
  text += chunk;
  console.log("收到:", chunk, "→ 累计:", text);
}
console.log("最终:", text);</code></pre></div>

<p><strong>追问：这段代码耗时和串行一样（1200ms+），异步体现在哪？</strong>观察得对——它本来就该一样慢。这里要把异步的两种收益分开：</p>
<ul>
  <li><strong>收益① 并发（省总时间）</strong>：多个<strong>互相独立</strong>的任务，等待时间重叠 → 总耗时下降。这是 <code>Promise.all</code> 干的事（第 2 节⑥实测过）。</li>
  <li><strong>收益② 流式 + 不阻塞（省的是别的东西）</strong>：<code>fakeLlmStream</code> 是<strong>一个</strong>任务，4 个 chunk 有内在顺序（真实 LLM 也一样：第 100 个 token 必须在第 99 个之后生成），1200ms 无法压缩。<strong>这不是缺陷，是流式的本质。</strong>它省的是：① <strong>边到边用</strong>——300ms 时就拿到第一个 chunk，不用等全部（LLM 逐字输出 vs 干等 20 秒空白）；② <strong>等待期间事件循环是自由的</strong>——4 个 300ms 的空档可以被别的任务"免费"利用。</li>
</ul>
<p>第②点光看上面的 demo 感受不到，加一个同时跑的"心跳"任务让证据可见：</p>
<div class="pre-wrap"><pre data-playground><code>const t0 = Date.now();
const el = () => ((Date.now() - t0) / 1000).toFixed(1) + "s";

async function* fakeLlmStream() {
  for (const c of ["你好", "，我是", " pi", "。"]) {
    await new Promise((r) =&gt; setTimeout(r, 300));
    yield c;
  }
}

// 同一个事件循环上同时跑一个心跳任务
const ticker = (async () =&gt; {
  for (let i = 1; i &lt;= 5; i++) {
    await new Promise((r) =&gt; setTimeout(r, 200));
    console.log("  [" + el() + "] 心跳 " + i + "：别的事照常在跑");
  }
})();

let text = "";
for await (const chunk of fakeLlmStream()) {
  text += chunk;

<h4>① 事件流是产品的边界（最重要的架构决策）</h4>
<p><code>runLoop</code> <strong>从不打印任何东西</strong>，只通过 <code>emit</code> 吐出 <code>AgentEvent</code>，返回值是 <code>EventStream&lt;AgentEvent, AgentMessage[]&gt;</code>：</p>
<div class="pre-wrap"><pre data-lang="text"><code>agentLoop(...) → EventStream ─┬─→ TUI 订阅渲染（packages/tui）

                              └─→ 测试断言（test/suite）</code></pre></div>
<div class="callout key">
  <strong>设计原则 #1：核心逻辑与 UI 完全通过事件解耦。</strong>
  你将来用 Electron 开发音频 agent，核心应该一行 UI 依赖都没有，React 组件订阅同样的事件流。
  这也直接回答了"如何评估"——测试就是订阅事件流然后断言事件序列。
</div>

<h4>② 双层循环：steering 与 follow-up</h4>
<div class="pre-wrap"><pre data-lang="text"><code>外层 while(true)            ← getFollowUpMessages：干完活后队列里还有新任务吗？
  内层 while(tools||pending) ← getSteeringMessages：干活中用户插话了吗？</code></pre></div>
<p>手搓 loop 假设"用户说完 → agent 跑完 → 用户再说"。真实产品里用户会在 agent 执行中途打字（"别改那个文件"），这些消息被注入到<strong>下一个 LLM 调用之前</strong>。这是交互式 agent 和脚本式 agent 的分水岭。</p>

<h4>③ 截断保护</h4>
<div class="pre-wrap"><pre><code>message.stopReason === "length"
  ? await failToolCallsFromTruncatedMessage(toolCalls, emit)  // 全部标错，不执行
  : await executeToolCalls(...)</code></pre></div>
<p>输出 token 用光时，流式 tool call 的参数 JSON 会被截断，salvage parser 可能解析出"看起来合法但悄悄缺字段"的参数（比如 <code>edit</code> 的 <code>newText</code> 少了一半）。<strong>pi 的选择：一个都不执行，把错误反馈给模型让它重发。</strong>"模型输出不可信，必须防御"的思维贯穿整个仓库。</p>

<h4>④ 工具执行的三段管线 + 两种调度</h4>
<p><code>prepare → execute → finalize</code>，外加 parallel / sequential（<code>executionMode</code> 由工具自己声明：<code>edit</code> 必须串行，<code>read</code> 可以并行）。</p>
<ul>
  <li><strong>prepare</strong>：找工具、schema 校验参数、跑 <code>beforeToolCall</code> 钩子（可 block）。全部错误都<strong>转成 toolResult 喂回模型而不是抛出</strong>——模型看到 "Tool xxx not found" 会自己纠正，这是 agent 自愈的关键。</li>
  <li><strong>execute</strong>：执行中可发 <code>tool_execution_update</code> 部分结果（如 bash 流式输出）。</li>
  <li><strong>finalize</strong>：<code>afterToolCall</code> 钩子可改写结果（如裁剪超长输出）。</li>
  <li><strong>terminate 标志</strong>：工具可以说"到此为止，别再调用 LLM 了"。</li>
</ul>

<h4>⑤ AbortSignal 贯穿一切</h4>
<p><code>signal</code> 从 UI 一路传到 LLM 流和每个工具执行。用户按 <span class="kbd">Esc</span> → 所有 HTTP 请求和子进程被取消。检查点散布 loop 各处（<code>if (signal?.aborted) break</code>）。<strong>取消是 agent 产品的一等功能</strong>，不是事后补丁。</p>

<h4>⑥ 扩展点全部走 config 回调</h4>

    if (!btn) return;

    status.dataset.for = secId;
    head.appendChild(status);
    // 找本节的最后一个元素（到下一个 h3 或 footer 为止）
    let last = h;
    let node = h.nextElementSibling;
    while (node && node.tagName !== "H3") { last = node; node = node.nextElementSibling; }
    const tail = document.createElement("div");
    tail.className = "section-tail";
    tail.appendChild(btn);
    last.after(tail);
  });
}

let tsLoading = null;

function loadTsCompiler() {
  if (window.ts) return Promise.resolve();
  if (tsLoading) return tsLoading;
  tsLoading = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "vendor/typescript.js";
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("编译器加载失败：vendor/typescript.js 不存在"));
    document.head.appendChild(s);
  });
  return tsLoading;
}

// 编辑器高亮：透明 textarea 盖在高亮 pre 上
function updateEditorHighlight() {
  pgHighlight.innerHTML = hljs.highlight(pgEditor.value, { language: "typescript" }).value + "\n";
}

function openPlayground(code) {
  if (code !== undefined) {
    pgEditor.value = code;
  } else if (!pgEditor.value) {
    pgEditor.value = state.pgCode || DEFAULT_PG_CODE;
  }
  state.pgCode = pgEditor.value;
  state.pgOpen = true;
  save(state);
  updateEditorHighlight();
  pgPanel.classList.remove("pg-hidden");
  updateAside();
  pgOutput.textContent = "";
  pgEditor.focus();
  loadTsCompiler().catch(() => {}); // 后台预加载
}

function closePlayground() {
  pgPanel.classList.add("pg-hidden");
  updateAside();
  state.pgOpen = false;
  save(state);
}

function fmtVal(v) {
  if (typeof v === "string") return v;
  if (v === undefined) return "undefined";
  if (v instanceof Error) return v.stack || String(v);
  try { return JSON.stringify(v, null, 2) ?? String(v); } catch { return String(v); }
}

function setPgOutput(text) {
  pgOutput.textContent = text;
  pgOutput.scrollTop = pgOutput.scrollHeight;  // 自动跟随到最新输出
}

async function runPlayground() {
  setPgOutput("编译中…（首次运行需加载 9MB 编译器）");
  try { await loadTsCompiler(); } catch (e) { setPgOutput(String(e)); return; }
  let js;
  try {
    js = window.ts.transpileModule(pgEditor.value, {
      compilerOptions: { module: window.ts.ModuleKind.None, target: window.ts.ScriptTarget.ES2022 },
    }).outputText;
  } catch (e) {
    setPgOutput("编译错误: " + (e instanceof Error ? e.message : String(e)));
    return;
  }
  const lines = [];
  // 流式渲染：边执行边显示，迟到的 log（比如主函数结束后才触发的定时器）也能看到
  const render = () => setPgOutput(lines.join("\n"));
  const fakeConsole = {
    log: (...a) => { lines.push(a.map(fmtVal).join(" ")); render(); },
    error: (...a) => { lines.push("[error] " + a.map(fmtVal).join(" ")); render(); },
    warn: (...a) => { lines.push("[warn] " + a.map(fmtVal).join(" ")); render(); },
  };
  try {
    const fn = new Function("console", '"use strict"; return (async () => {\n' + js + '\n})();');
    await fn(fakeConsole);
    if (!lines.length) setPgOutput("(无输出 —— 试试 console.log)");
  } catch (e) {
    lines.push("[运行时错误] " + (e instanceof Error ? e.message : String(e)));
    render();
  }
}

// 编辑后统一收尾：高亮 + 保存 + 补全
function afterPgEdit() {
  updateEditorHighlight();
  state.pgCode = pgEditor.value;
  save(state);
  updateCompletion();
}

// 替换当前选区为 text，光标落到插入文本末尾
function pgReplaceSelection(text) {
  const s = pgEditor.selectionStart;
  pgEditor.value = pgEditor.value.slice(0, s) + text + pgEditor.value.slice(pgEditor.selectionEnd);
  pgEditor.selectionStart = pgEditor.selectionEnd = s + text.length;
  afterPgEdit();
}

// ===================== 词法级代码补全 =====================
// 候选 = 当前代码里出现过的标识符 + 常用内建（VS Code 的 word-based suggestions 同款；
// 不是类型感知的 IntelliSense——那个需要挂 tsserver，工程量另算）
const PG_BUILTINS = [
  "console", "log", "error", "warn", "Promise", "setTimeout", "setInterval",
  "JSON", "parse", "stringify", "Object", "Array", "Map", "Set", "Math", "Date",
  "Number", "String", "Boolean", "isArray", "keys", "values", "entries",
  "then", "catch", "finally", "async", "await", "function", "const", "let",
  "return", "new", "for", "of", "if", "else", "true", "false", "undefined",
  "string", "number", "boolean", "void", "any", "unknown", "interface", "type",
];
const pgComplete = document.getElementById("pg-complete");
let ciItems = [], ciIndex = 0, ciStart = 0;

function currentWord() {
  const s = pgEditor.selectionStart;
  const m = pgEditor.value.slice(0, s).match(/[A-Za-z_$][\w$]*$/);
  return m ? { word: m[0], start: s - m[0].length } : null;
}

let pgCharWidth = 0;
function caretXY() {
  const cs = getComputedStyle(pgEditor);
  if (!pgCharWidth) {
    const ctx = document.createElement("canvas").getContext("2d");
    ctx.font = cs.fontSize + " " + cs.fontFamily;
    pgCharWidth = ctx.measureText("x").width;  // 等宽字体：列宽恒定
  }
  const lh = parseFloat(cs.lineHeight);
  const before = pgEditor.value.slice(0, pgEditor.selectionStart);
  const line = (before.match(/\n/g) || []).length;
  const col = before.length - before.lastIndexOf("\n") - 1;
  return {
    x: parseFloat(cs.paddingLeft) + col * pgCharWidth - pgEditor.scrollLeft,
    y: parseFloat(cs.paddingTop) + (line + 1) * lh - pgEditor.scrollTop,
  };
}

// 程序移动光标后（如 Home/End），手动把光标滚进可视区
function scrollCaretIntoView() {
  const cs = getComputedStyle(pgEditor);
  const padL = parseFloat(cs.paddingLeft);
  const padT = parseFloat(cs.paddingTop);
  const lh = parseFloat(cs.lineHeight);
  const { x, y } = caretXY();  // caretXY 返回的是相对可视区的坐标
  if (x + pgCharWidth > pgEditor.clientWidth) {
    pgEditor.scrollLeft += x + pgCharWidth - pgEditor.clientWidth + 20;
  } else if (x < padL) {
    pgEditor.scrollLeft -= padL - x + 20;
  }
  if (y > pgEditor.clientHeight) {
    pgEditor.scrollTop += y - pgEditor.clientHeight + lh;
  } else if (y - lh < padT) {
    pgEditor.scrollTop -= padT - (y - lh);
  }
  // 同步高亮层的滚动位置
  const pre = pgHighlight.parentElement;
  pre.scrollTop = pgEditor.scrollTop;
  pre.scrollLeft = pgEditor.scrollLeft;
}

function updateCompletion() {
  const w = currentWord();
  if (!w || w.word.length < 2) return hideCompletion();
  ciStart = w.start;
  const ids = new Set(PG_BUILTINS);
  for (const m of pgEditor.value.matchAll(/[A-Za-z_$][\w$]*/g)) ids.add(m[0]);
  ciItems = [...ids].filter((x) => x.startsWith(w.word) && x !== w.word).slice(0, 8);
  if (!ciItems.length) return hideCompletion();
  ciIndex = 0;
  renderCompletion();
}

function renderCompletion() {
  pgComplete.innerHTML = ciItems.map((t, i) =>
    `<div class="pg-ci${i === ciIndex ? " active" : ""}" data-i="${i}">${t}</div>`).join("");
  const { x, y } = caretXY();
  const wrap = document.getElementById("pg-editor-wrap");
  pgComplete.style.left = Math.min(x, wrap.clientWidth - 180) + "px";
  pgComplete.style.top = y + "px";
  pgComplete.classList.remove("pg-hidden");
  pgComplete.querySelectorAll(".pg-ci").forEach((el) => {
    el.onmousedown = (ev) => { ev.preventDefault(); acceptCompletion(+el.dataset.i); };
  });
}

function hideCompletion() {
  pgComplete.classList.add("pg-hidden");
  ciItems = [];
}

function acceptCompletion(i) {
  const item = ciItems[i ?? ciIndex];
  if (!item) return hideCompletion();
  pgEditor.setSelectionRange(ciStart, pgEditor.selectionStart);
  pgReplaceSelection(item);
  hideCompletion();
  pgEditor.focus();
}

pgEditor.addEventListener("input", afterPgEdit);
pgEditor.addEventListener("click", hideCompletion);
pgEditor.addEventListener("scroll", () => {
  const pre = pgHighlight.parentElement;
  pre.scrollTop = pgEditor.scrollTop;
  pre.scrollLeft = pgEditor.scrollLeft;
  hideCompletion();
});

pgEditor.addEventListener("keydown", (e) => {
  const completionOpen = !pgComplete.classList.contains("pg-hidden");
  // 补全下拉打开时优先响应导航键
  if (completionOpen) {
    if (e.key === "ArrowDown") { e.preventDefault(); ciIndex = (ciIndex + 1) % ciItems.length; renderCompletion(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); ciIndex = (ciIndex - 1 + ciItems.length) % ciItems.length; renderCompletion(); return; }
    if (e.key === "Tab" || e.key === "Enter") { e.preventDefault(); acceptCompletion(); return; }
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); hideCompletion(); return; }
  }
  // Tab：插入两个空格
  if (e.key === "Tab") {
    e.preventDefault();
    pgReplaceSelection("  ");
    return;
  }
  // Enter：自动缩进（继承本行缩进；以 { ( [ 结尾再加一级）。⌘/Ctrl+Enter 留给运行
  if (e.key === "Enter") {
    if (e.metaKey || e.ctrlKey) return;
    e.preventDefault();
    const v = pgEditor.value, s = pgEditor.selectionStart;
    const lineText = v.slice(v.lastIndexOf("\n", s - 1) + 1, s);
    const indent = (lineText.match(/^\s*/) || [""])[0];
    const before = v[s - 1], after = v[s];
    const pairs = { "{": "}", "(": ")", "[": "]" };
    const extra = /[{(\[]\s*$/.test(lineText) ? "  " : "";
    if (extra && pairs[before] === after) {
      // 光标在开闭括号之间（如 foo({|})）：展开成三行，光标停在中行
      pgReplaceSelection("\n" + indent + extra + "\n" + indent);
      const pos = pgEditor.selectionStart;
      pgEditor.selectionStart = pgEditor.selectionEnd = pos - indent.length - 1;
    } else {
      pgReplaceSelection("\n" + indent + extra);
    }
    return;
  }
  // }：行首只有空白时自动减一级缩进
  if (e.key === "}") {
    const v = pgEditor.value, s = pgEditor.selectionStart;
    const before = v.slice(v.lastIndexOf("\n", s - 1) + 1, s);
    if (/^\s+$/.test(before) && before.length >= 2) {
      e.preventDefault();
      pgEditor.setSelectionRange(s - 2, s);
      pgReplaceSelection("}");
    }
    return;
  }
  // Home/End：行首/行尾（macOS 默认是文档头尾，不符合编辑器习惯）
  if (e.key === "Home" || e.key === "End") {
    e.preventDefault();
    const v = pgEditor.value, s = pgEditor.selectionStart;
    const ls = v.lastIndexOf("\n", s - 1) + 1;
    let le = v.indexOf("\n", s);
    if (le === -1) le = v.length;
    const target = e.key === "Home" ? ls : le;
    if (e.shiftKey) {
      const caretAtEnd = pgEditor.selectionEnd === s;
      const anchor = caretAtEnd ? pgEditor.selectionStart : pgEditor.selectionEnd;
      pgEditor.setSelectionRange(Math.min(anchor, target), Math.max(anchor, target));
    } else {
      pgEditor.setSelectionRange(target, target);
    }
    scrollCaretIntoView();
    return;
  }
});

document.getElementById("pg-fab").onclick = () => {
  if (pgPanel.classList.contains("pg-hidden")) openPlayground();
  else closePlayground();
};
document.getElementById("pg-run").onclick = runPlayground;
document.getElementById("pg-close").onclick = closePlayground;
document.addEventListener("keydown", (e) => {
  // ⌘/Ctrl+B：切换课程目录
  if ((e.metaKey || e.ctrlKey) && (e.key === "b" || e.key === "B")) {
    e.preventDefault();
    if (mobileMq.matches) {
      const aside = document.querySelector("aside");
      setMobileDrawer(!aside.classList.contains("mobile-open"));
      return;
    }
    state.navHidden = !state.navHidden;
    save(state);
    updateAside();
    return;
  }
  // Ctrl+`：切换 playground
  if (e.ctrlKey && e.key === "`") {
    e.preventDefault();
    if (pgPanel.classList.contains("pg-hidden")) openPlayground();
    else closePlayground();
    return;
  }
  if (pgPanel.classList.contains("pg-hidden")) return;
  if (e.key === "Escape") closePlayground();
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); runPlayground(); }
});

// 给带 data-playground 的代码块加"试一试"按钮
function enhancePlaygroundBlocks(root) {
  root.querySelectorAll("pre[data-playground]").forEach((pre) => {
    if (pre.querySelector(".pg-open-btn")) return;
    const btn = document.createElement("button");
    btn.className = "pg-open-btn";
    btn.textContent = "▶ 试一试";
    btn.onclick = () => openPlayground(pre.querySelector("code")?.textContent || "");
    pre.appendChild(btn);
  });
}

// 课程内容代码高亮：pair 块按标签识语言，其余默认 typescript，data-lang="text" 跳过
function highlightLessonCode(root) {
  root.querySelectorAll("pre code").forEach((codeEl) => {
    const pre = codeEl.parentElement;
    let lang = pre.dataset.lang || "typescript";
    const cell = pre.closest(".cell");
    if (cell) {
      const label = cell.querySelector(".lang");
      if (label && label.classList.contains("py")) lang = "python";
    }
    try {
      codeEl.innerHTML = hljs.highlight(codeEl.textContent, { language: lang }).value;
      codeEl.classList.add("hljs");
    } catch { /* 语言不支持则跳过 */ }
  });
}

// ===================== 事件循环可视化 =====================
// 两个 async 函数的执行轨迹：一个等定时器（宏任务），一个等已完成 Promise（微任务）
const EVL_STEPS = [
  { note: "同步阶段开始：主程序调用 download()，进入函数，打印第一行。", stack: ["主程序", "download()"], micro: [], macro: [], log: ["A: 开始下载"] },
  { note: "download 执行到 await sleep(500)：创建 Promise + 注册 500ms 定时器（宏任务队列），download 冻结在 await 点，剩余代码打包成续体，向主程序返回一个 pending Promise。", stack: ["主程序"], micro: [], macro: ["⏱ 定时器 500ms"], log: ["A: 开始下载"] },
  { note: "主程序继续往下：调用 parse()，打印 B 的第一行。", stack: ["主程序", "parse()"], micro: [], macro: ["⏱ 定时器 500ms"], log: ["A: 开始下载", "B: 开始解析"] },
  { note: "parse 执行到 await Promise.resolve()：Promise 已完成，所以续体直接进【微任务队列】，parse 冻结。", stack: ["主程序"], micro: ["parse 续体: log(B: 解析完成)"], macro: ["⏱ 定时器 500ms"], log: ["A: 开始下载", "B: 开始解析"] },
  { note: "主程序最后一行：打印 C。", stack: ["主程序"], micro: ["parse 续体: log(B: 解析完成)"], macro: ["⏱ 定时器 500ms"], log: ["A: 开始下载", "B: 开始解析", "C: 同步代码结束"] },
  { note: "同步代码全部跑完，调用栈清空。事件循环开始工作：先看微任务队列——微任务永远优先于宏任务。", stack: [], micro: ["parse 续体: log(B: 解析完成)"], macro: ["⏱ 定时器 500ms"], log: ["A: 开始下载", "B: 开始解析", "C: 同步代码结束"] },
  { note: "取出微任务：parse 从 await 点恢复，打印 B: 解析完成，函数结束。", stack: [], micro: [], macro: ["⏱ 定时器 500ms"], log: ["A: 开始下载", "B: 开始解析", "C: 同步代码结束", "B: 解析完成"] },
  { note: "微任务队列已空，定时器还没到点。事件循环等待中……（时间流逝）", stack: [], micro: [], macro: ["⏱ 定时器 500ms"], log: ["A: 开始下载", "B: 开始解析", "C: 同步代码结束", "B: 解析完成"] },
  { note: "500ms 到！定时器回调进入宏任务队列。", stack: [], micro: [], macro: ["⏱ 定时器回调"], log: ["A: 开始下载", "B: 开始解析", "C: 同步代码结束", "B: 解析完成"] },
  { note: "执行宏任务：定时器回调把 sleep 的 Promise 置为 fulfilled → download 的续体进入微任务队列。", stack: ["定时器回调"], micro: ["download 续体: log(A: 下载完成)"], macro: [], log: ["A: 开始下载", "B: 开始解析", "C: 同步代码结束", "B: 解析完成"] },
  { note: "宏任务执行完，立即排空微任务：download 从 await 点恢复，打印 A: 下载完成。", stack: [], micro: [], macro: [], log: ["A: 开始下载", "B: 开始解析", "C: 同步代码结束", "B: 解析完成", "A: 下载完成"] },
  { note: "所有队列清空，程序结束。回顾顺序铁律：同步代码 → 微任务 → 宏任务 → 新产生的微任务。", stack: [], micro: [], macro: [], log: ["A: 开始下载", "B: 开始解析", "C: 同步代码结束", "B: 解析完成", "A: 下载完成"] },
];

function initEvlViz(main) {
  const root = main.querySelector("#evl-viz");
  if (!root || root.dataset.ready) return;
  root.dataset.ready = "1";
  let cur = 0, timer = null;
  root.innerHTML =
    '<div class="evl">' +
    '<div class="evl-note"><span class="evl-step-no"></span><span class="evl-note-text"></span></div>' +
    '<div class="evl-controls">' +
    '<button data-act="prev">← 上一步</button>' +
    '<button data-act="next">下一步 →</button>' +
    '<button data-act="auto">▶ 自动播放</button>' +
    '<button data-act="reset">重置</button>' +
    '</div>' +
    '<div class="evl-grid">' +
    '<div class="evl-panel"><div class="evl-panel-title">调用栈</div><div class="evl-items stack"></div></div>' +
    '<div class="evl-panel"><div class="evl-panel-title">微任务队列（Promise 续体）</div><div class="evl-items micro"></div></div>' +
    '<div class="evl-panel"><div class="evl-panel-title">宏任务队列（定时器等）</div><div class="evl-items macro"></div></div>' +
    '</div>' +
    '<div class="evl-log-title">输出日志</div>' +
    '<div class="evl-log"></div>' +
    '</div>';

  const noteNo = root.querySelector(".evl-step-no");
  const noteText = root.querySelector(".evl-note-text");
  const stackEl = root.querySelector(".evl-items.stack");
  const microEl = root.querySelector(".evl-items.micro");
  const macroEl = root.querySelector(".evl-items.macro");
  const logEl = root.querySelector(".evl-log");
  const btns = root.querySelectorAll(".evl-controls button");

  function renderStep() {
    const s = EVL_STEPS[cur];
    noteNo.textContent = "步骤 " + (cur + 1) + "/" + EVL_STEPS.length;
    noteText.textContent = s.note;
    const fill = (el, items, cls) => {
      el.innerHTML = items.length
        ? items.map((t) => `<div class="evl-item ${cls}">${t}</div>`).join("")
        : '<div class="evl-empty">（空）</div>';
    };
    fill(stackEl, s.stack, "st");
    fill(microEl, s.micro, "mi");
    fill(macroEl, s.macro, "ma");
    logEl.textContent = s.log.join("\n");
    btns[0].disabled = cur === 0;
    btns[1].disabled = cur === EVL_STEPS.length - 1;
  }
  function stopAuto() {
    if (timer) { clearInterval(timer); timer = null; btns[2].textContent = "▶ 自动播放"; }
  }
  btns[0].onclick = () => { stopAuto(); if (cur > 0) { cur--; renderStep(); } };
  btns[1].onclick = () => { stopAuto(); if (cur < EVL_STEPS.length - 1) { cur++; renderStep(); } };
  btns[2].onclick = () => {
    if (timer) return stopAuto();
    if (cur >= EVL_STEPS.length - 1) cur = 0;
    renderStep();
    btns[2].textContent = "⏸ 暂停";
    timer = setInterval(() => {
      if (cur >= EVL_STEPS.length - 1) return stopAuto();
      cur++;
      renderStep();
    }, 1800);
  };
  btns[3].onclick = () => { stopAuto(); cur = 0; renderStep(); };
  renderStep();
}

function buildQuizCard(secId, questions) {
  const card = document.createElement("div");
  card.className = "quiz";
  card.innerHTML = `<div class="quiz-title">✎ 检验一下 · 答对全部 ${questions.length} 题才能标记完成</div>`;
  questions.forEach((q, qi) => {
    const qd = document.createElement("div");
    qd.className = "quiz-q";
    qd.innerHTML = `<div class="q-text">${qi + 1}. ${q.q}</div>` +
      q.options.map((o, oi) =>
        `<label class="quiz-opt"><input type="radio" name="q-${secId}-${qi}" value="${oi}"><span>${o}</span></label>`
      ).join("") +
      `<div class="quiz-explain" hidden></div>`;
    card.appendChild(qd);
  });
  const actions = document.createElement("div");
  actions.className = "quiz-actions";
  actions.innerHTML = `<button class="quiz-submit">提交答案</button><span class="quiz-status"></span>`;
  card.appendChild(actions);

  const statusEl = actions.querySelector(".quiz-status");
  if (state.quiz && state.quiz[secId]) {
    statusEl.className = "quiz-status pass";
    statusEl.textContent = "已通过 ✓（可以重练）";
  }
  actions.querySelector(".quiz-submit").onclick = () => {
    let allAnswered = true, allCorrect = true;
    const qds = card.querySelectorAll(".quiz-q");
    questions.forEach((q, qi) => {
      const qd = qds[qi];
      const sel = qd.querySelector(`input[name="q-${secId}-${qi}"]:checked`);
      const optEls = qd.querySelectorAll(".quiz-opt");
      optEls.forEach((el) => el.classList.remove("correct", "wrong"));
      if (!sel) { allAnswered = false; return; }
      const chosen = +sel.value;
      if (chosen === q.answer) {
        optEls[chosen].classList.add("correct");
      } else {
        optEls[chosen].classList.add("wrong");
        optEls[q.answer].classList.add("correct");
        allCorrect = false;
      }
      if (q.explain) {
        const ex = qd.querySelector(".quiz-explain");
        ex.hidden = false;
        ex.textContent = "💡 " + q.explain;
      }
    });
    if (!allAnswered) {
      statusEl.className = "quiz-status fail";
      statusEl.textContent = "还有题目没作答";
      return;
    }
    if (allCorrect) {
      state.quiz = state.quiz || {};
      state.quiz[secId] = true;
      save(state);
      statusEl.className = "quiz-status pass";
      statusEl.textContent = "全部答对，章节可以标记完成了 ✓";
      const btn = document.querySelector(`.done-btn[data-section="${secId}"]`);
      if (btn && !state.sections[secId]) {
        btn.disabled = false;
        btn.textContent = "标记完成";
      }
    } else {
      statusEl.className = "quiz-status fail";
      statusEl.textContent = "有答错的，看解析后再试一次";
    }
  };
  return card;
}

function renderQuizzes(main) {
  main.querySelectorAll(".article h3[id]").forEach((h) => {
    const questions = QUIZZES[h.id];
    if (!questions) return;
    // 找本节的尾部（第一个 .section-tail 兄弟）
    let node = h.nextElementSibling;
    while (node && node.tagName !== "H3" && !node.classList.contains("section-tail")) {
      node = node.nextElementSibling;
    }
    if (node && node.classList.contains("section-tail")) {
      node.before(buildQuizCard(h.id, questions));
    }
  });
}

// ===================== Hash 路由 =====================
// 格式：#lesson-id/section-id，刷新后恢复课程和滚动位置
function parseHash() {
  const m = location.hash.match(/^#([^/]+)(?:\/(.+))?$/);
  return m ? { lesson: m[1], section: m[2] } : null;
}

function applyHash() {
  const h = parseHash();
  if (!h) return;
  const lesson = LESSONS.find(l => l.id === h.lesson && !l.locked);
  if (!lesson) return;
  currentLesson = lesson.id;
  state.currentLesson = lesson.id;
  save(state);
  render();
  requestAnimationFrame(() => {
    if (h.section) {
      document.getElementById(h.section)?.scrollIntoView({ block: "start" });
    } else {
      window.scrollTo(0, 0);
    }
  });
}

// 滚动时自动同步 hash（scroll spy）
let spyTicking = false;
window.addEventListener("scroll", () => {
  if (spyTicking) return;
  spyTicking = true;
  requestAnimationFrame(() => {
    spyTicking = false;
    const heads = [...document.querySelectorAll(".article h3[id]")];
    let active = null;
    for (const h of heads) {
      if (h.getBoundingClientRect().top <= 120) active = h;
      else break;
    }
    const newHash = "#" + currentLesson + (active ? "/" + active.id : "");
    if (location.hash !== newHash) history.replaceState(null, "", newHash);
  });
});
window.addEventListener("hashchange", applyHash);

// 恢复上次的 playground 面板状态
if (state.pgOpen) openPlayground();

// 有 hash 则定位（覆盖 localStorage 的 currentLesson）
if (location.hash) applyHash();

function render() { renderNav(); renderContent(); renderProgress(); }
render();

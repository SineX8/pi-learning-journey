<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pi Agent 源码学习之旅</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-soft: #161b22;
    --bg-code: #1c2129;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent2: #d2a8ff;
    --green: #3fb950;
    --orange: #d29922;
    --red: #f85149;
    --py: #3572A5;
    --ts: #3178c6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.75;
  }
  .layout { display: flex; min-height: 100vh; }

  /* ---- Sidebar ---- */
  aside {
    width: 280px; flex-shrink: 0;
    background: var(--bg-soft);
    border-right: 1px solid var(--border);
    padding: 24px 0;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { padding: 0 20px 20px; border-bottom: 1px solid var(--border); }
  .brand-row { display: flex; justify-content: space-between; align-items: flex-start; }
  #nav-hide {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px; font-family: inherit;
    width: 24px; height: 24px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #nav-hide:hover { color: var(--text); border-color: var(--text-dim); }
  #nav-show {
    position: fixed; left: 0; top: 50%; transform: translateY(-50%); z-index: 80;
    background: var(--bg-soft); color: var(--text-dim);
    border: 1px solid var(--border); border-left: none;
    border-radius: 0 8px 8px 0;
    font-size: 16px; font-family: inherit;
    width: 26px; height: 56px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 2px 0 10px rgba(0,0,0,.3);
    transition: width .15s, color .15s;
  }
  #nav-show:hover { color: var(--accent); width: 32px; }
  #nav-show.hidden { display: none; }
  aside.collapsed { display: none; }
  .brand h1 { font-size: 17px; font-weight: 700; }
  .brand p { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .progress-wrap { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .progress-label { font-size: 12px; color: var(--text-dim); display: flex; justify-content: space-between; margin-bottom: 6px; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0%; transition: width .4s; }
  nav { padding: 12px 0; }
  .nav-item { display: block; padding: 10px 20px; cursor: pointer; border-left: 3px solid transparent; }
  .nav-item:hover { background: rgba(88,166,255,.08); }
  .nav-item.active { border-left-color: var(--accent); background: rgba(88,166,255,.12); }
  .nav-item .nav-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .nav-item .nav-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .nav-item .check { color: var(--green); font-size: 13px; }
  .nav-item.locked { opacity: .45; cursor: default; }
  .nav-item.locked:hover { background: none; }

  /* ---- Main ---- */
  main { flex: 1; display: flex; gap: 40px; align-items: flex-start; padding: 48px 40px 120px; }
  .article { flex: 1; min-width: 0; max-width: 900px; }
  .lesson-header { margin-bottom: 32px; }
  .lesson-tag { font-size: 12px; color: var(--accent); font-weight: 700; letter-spacing: 2px; }
  .lesson-header h2 { font-size: 28px; margin: 6px 0 8px; }
  .lesson-header .meta { color: var(--text-dim); font-size: 13px; }
  h3 { font-size: 20px; margin: 40px 0 14px; padding-top: 24px; border-top: 1px solid var(--border); }
  h4 { font-size: 16px; margin: 28px 0 10px; color: var(--accent2); }
  p { margin: 10px 0; }
  ul, ol { margin: 10px 0 10px 24px; }
  li { margin: 6px 0; }
  code {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: .88em;
    background: var(--bg-code);
    padding: 2px 6px; border-radius: 4px;
    color: #79c0ff;
  }
  pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    margin: 0;
    font-size: 13px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  pre code { background: none; padding: 0; color: var(--text); }
  .pre-wrap { margin: 14px 0; }
  .file-ref {
    display: inline-block;
    font-family: "SF Mono", Menlo, monospace; font-size: 12px;
    background: rgba(88,166,255,.12); color: var(--accent);
    padding: 2px 8px; border-radius: 4px; margin: 2px 0;
  }

  /* Python vs TS 对照块 */
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
  .pair .cell { min-width: 0; }
  .pair .lang {
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    padding: 4px 10px; border-radius: 6px 6px 0 0; display: inline-block;
  }
  .pair .lang.py { background: rgba(53,114,165,.3); color: #6cb6ff; }
  .pair .lang.ts { background: rgba(49,120,198,.3); color: #79c0ff; }
  .pair pre { border-radius: 0 8px 8px 8px; height: 100%; }
  .pair .cell { display: flex; flex-direction: column; }
  .pair .cell pre { flex: 1; }
  @media (max-width: 1100px) { .pair { grid-template-columns: 1fr; } }

  .callout {
    border-left: 3px solid var(--accent);
    background: rgba(88,166,255,.08);
    padding: 12px 16px; border-radius: 0 8px 8px 0;
    margin: 16px 0; font-size: 14px;
  }
  .callout.warn { border-left-color: var(--orange); background: rgba(210,153,34,.08); }
  .callout.key { border-left-color: var(--green); background: rgba(63,185,80,.08); }
  .callout.danger { border-left-color: var(--red); background: rgba(248,81,73,.08); }
  .callout strong { color: var(--text); }
  table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; }
  th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  th { background: var(--bg-soft); font-size: 13px; }
  td { font-size: 13.5px; }

  .section-head { display: flex; align-items: center; gap: 12px; }
  .sec-status { font-weight: 700; color: var(--green); font-size: 15px; }
  .sec-status.pending { color: var(--border); }
  .section-tail { display: flex; margin: 26px 0 4px; }
  .section-tail .done-btn {
    width: 100%; padding: 11px; font-size: 14px; border-radius: 10px;
    background: var(--bg-soft); border: 1px dashed var(--text-dim); color: var(--text-dim);
    letter-spacing: 1px;
  }
  .section-tail .done-btn:hover { border-color: var(--green); color: var(--green); border-style: solid; }
  .section-tail .done-btn.done {
    background: var(--green); border: 1px solid var(--green); color: #0d1117;
    font-weight: 700; letter-spacing: 0;
  }
  .section-tail .done-btn:disabled { opacity: .45; cursor: not-allowed; }
  .section-tail .done-btn:disabled:hover { border-color: var(--text-dim); color: var(--text-dim); border-style: dashed; }

  /* ---- 事件循环可视化 ---- */
  .evl { border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin: 16px 0; background: var(--bg-soft); }
  .evl-note {
    font-size: 13.5px; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px;
    background: rgba(88,166,255,.1); border-left: 3px solid var(--accent); min-height: 22px;
  }
  .evl-note .evl-step-no { color: var(--accent); font-weight: 700; margin-right: 8px; }
  .evl-controls { display: flex; gap: 8px; margin-bottom: 12px; }
  .evl-controls button {
    background: var(--bg-code); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; font-size: 12.5px; font-family: inherit; padding: 5px 14px; cursor: pointer;
  }
  .evl-controls button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .evl-controls button:disabled { opacity: .4; cursor: not-allowed; }
  .evl-grid { display: grid; grid-template-columns: 1fr 1.4fr 1.2fr; gap: 10px; }
  .evl-panel { border: 1px solid var(--border); border-radius: 8px; min-height: 130px; display: flex; flex-direction: column; }
  .evl-panel-title { font-size: 11px; letter-spacing: 1px; color: var(--text-dim); padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .evl-items { flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .evl-items.stack { flex-direction: column-reverse; }
  .evl-item {
    font-family: "SF Mono", Menlo, monospace; font-size: 12px;
    padding: 4px 10px; border-radius: 6px; animation: evl-in .25s;
  }
  @keyframes evl-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  .evl-item.st { background: rgba(88,166,255,.15); border: 1px solid var(--accent); }
  .evl-item.mi { background: rgba(210,168,255,.12); border: 1px solid var(--accent2); }
  .evl-item.ma { background: rgba(210,153,34,.12); border: 1px solid var(--orange); }
  .evl-empty { color: var(--border); font-size: 12px; text-align: center; padding: 12px 0; }
  .evl-log-title { font-size: 11px; letter-spacing: 1px; color: var(--text-dim); margin-top: 10px; }
  .evl-log { margin-top: 6px; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; min-height: 40px; font-family: "SF Mono", Menlo, monospace; font-size: 12.5px; color: var(--green); white-space: pre-wrap; }

  /* ---- 章节测验 ---- */
  .quiz {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 20px; margin: 24px 0 6px; background: var(--bg-soft);
  }
  .quiz-title { font-size: 13px; font-weight: 700; color: var(--accent2); margin-bottom: 6px; }
  .quiz-q { margin: 14px 0; }
  .quiz-q .q-text { font-size: 14px; margin-bottom: 8px; }
  .quiz-opt {
    display: flex; gap: 8px; align-items: baseline;
    padding: 6px 10px; border-radius: 6px; cursor: pointer;
    font-size: 13.5px; color: var(--text-dim);
  }
  .quiz-opt:hover { background: rgba(88,166,255,.08); }
  .quiz-opt input { accent-color: var(--accent); margin-top: 2px; flex-shrink: 0; }
  .quiz-opt.correct { background: rgba(63,185,80,.15); color: var(--green); }
  .quiz-opt.wrong { background: rgba(248,81,73,.12); color: var(--red); }
  .quiz-explain { font-size: 12.5px; color: var(--text-dim); margin: 6px 0 0 28px; }
  .quiz-actions { margin-top: 12px; display: flex; gap: 12px; align-items: center; }
  .quiz-submit {
    background: var(--accent); color: #0d1117; border: none; border-radius: 6px;
    font-size: 13px; font-weight: 700; font-family: inherit;
    padding: 6px 16px; cursor: pointer;
  }
  .quiz-submit:hover { filter: brightness(1.15); }
  .quiz-status { font-size: 13px; }
  .quiz-status.pass { color: var(--green); font-weight: 700; }
  .quiz-status.fail { color: var(--orange); }
  .done-btn {
    flex-shrink: 0;
    font-size: 12px; font-family: inherit;
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 20px;
    padding: 3px 12px; cursor: pointer;
    transition: all .2s;
  }
  .done-btn:hover { border-color: var(--green); color: var(--green); }
  .done-btn.done { background: var(--green); border-color: var(--green); color: #0d1117; font-weight: 700; }

  .homework {
    border: 1px dashed var(--orange);
    border-radius: 10px; padding: 20px 22px; margin: 20px 0;
    background: rgba(210,153,34,.05);
  }
  .homework h4 { margin-top: 0; color: var(--orange); }
  .hw-check { display: flex; align-items: flex-start; gap: 10px; margin: 12px 0; cursor: pointer; }
  .hw-check input { margin-top: 5px; accent-color: var(--green); width: 16px; height: 16px; cursor: pointer; }
  .hw-check span { flex: 1; }

  footer { margin-top: 60px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--text-dim); font-size: 12px; }

  /* ---- 本课目录（TOC） ---- */
  .toc {
    width: 200px; flex-shrink: 0;
    position: sticky; top: 32px;
    max-height: calc(100vh - 64px);
    overflow-y: auto;
    font-size: 13px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .toc::-webkit-scrollbar { width: 6px; }
  .toc::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .toc::-webkit-scrollbar-track { background: transparent; }
  .toc-title {
    font-size: 11px; letter-spacing: 1.5px; color: var(--text-dim);
    margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .toc-item {
    display: flex; gap: 8px; align-items: baseline;
    padding: 5px 0; cursor: pointer; color: var(--text-dim);
  }
  .toc-item:hover { color: var(--text); }
  .toc-item.done { color: var(--text); }
  .toc-item .toc-check { width: 14px; flex-shrink: 0; color: var(--green); font-weight: 700; }

  /* ---- 代码高亮（自配 hljs 主题） ---- */
  .hljs-keyword, .hljs-selector-tag { color: #ff7b72; }
  .hljs-string, .hljs-doctag { color: #a5d6ff; }
  .hljs-number, .hljs-literal { color: #79c0ff; }
  .hljs-comment, .hljs-quote { color: #8b949e; font-style: italic; }
  .hljs-title, .hljs-title.function_ { color: #d2a8ff; }
  .hljs-title.class_, .hljs-type { color: #ffa657; }
  .hljs-built_in, .hljs-attr, .hljs-attribute { color: #79c0ff; }
  .hljs-variable, .hljs-template-variable { color: #ffa657; }

  /* ---- Playground（右侧常驻面板） ---- */
  #pg-fab {
    position: fixed; right: 24px; bottom: 24px; z-index: 90;
    background: var(--accent); color: #0d1117; border: none; border-radius: 24px;
    font-size: 13px; font-weight: 700; font-family: inherit;
    padding: 10px 18px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  #pg-fab:hover { background: #79c0ff; }
  #pg-panel {
    width: 460px; flex-shrink: 0;
    position: sticky; top: 0; height: 100vh;
    background: var(--bg-soft); border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  #pg-panel.pg-hidden { display: none; }
  #pg-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  #pg-header .pg-title { font-size: 14px; font-weight: 700; }
  #pg-header .pg-title span { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
  #pg-run {
    background: var(--green); color: #0d1117; border: none; border-radius: 6px;
    font-size: 12px; font-weight: 700; font-family: inherit;
    padding: 6px 14px; cursor: pointer; margin-right: 8px;
  }
  #pg-run:hover { filter: brightness(1.15); }
  #pg-close {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 6px; font-size: 12px; padding: 6px 10px; cursor: pointer;
  }
  #pg-close:hover { color: var(--text); border-color: var(--text-dim); }
  /* 编辑器：透明 textarea 盖在高亮层上 */
  #pg-editor-wrap {
    position: relative; flex: 1; min-height: 260px;
    border-bottom: 1px solid var(--border); overflow: hidden;
  }
  #pg-editor-wrap pre, #pg-editor {
    margin: 0; font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.65; padding: 14px 16px;
    tab-size: 2; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; overflow: auto;
  }
  #pg-editor-wrap pre {
    position: absolute; inset: 0; pointer-events: none;
    border: none; border-radius: 0; background: var(--bg-code);
  }
  /* 抵消全局 code 样式，保证高亮层和 textarea 字体度量完全一致 */
  #pg-highlight {
    font-size: inherit; font-family: inherit; line-height: inherit;
    padding: 0; background: none; color: var(--text);
  }
  #pg-editor {
    position: absolute; inset: 0; width: 100%; height: 100%;
    margin: 0;
    background: transparent; color: transparent; caret-color: #e6edf3;
    border: none; outline: none; resize: none;
  }
  #pg-editor::selection { background: rgba(88,166,255,.3); }
  /* 代码补全下拉 */
  #pg-complete {
    position: absolute; z-index: 5; min-width: 160px; max-height: 180px; overflow: auto;
    background: var(--bg-soft); border: 1px solid var(--accent); border-radius: 8px;
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px;
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
  }
  #pg-complete.pg-hidden { display: none; }
  .pg-ci { padding: 4px 12px; cursor: pointer; color: var(--text); white-space: nowrap; }
  .pg-ci.active { background: var(--accent); color: #0d1117; font-weight: 700; }
  #pg-output-label { font-size: 11px; color: var(--text-dim); padding: 8px 16px 0; letter-spacing: 1.5px; flex-shrink: 0; }
  #pg-output {
    height: 200px; min-height: 80px; max-height: 50vh; flex-shrink: 0;
    overflow: auto; resize: vertical;
    margin: 0; border: none;
    border-radius: 0; white-space: pre-wrap; word-break: break-word;
    background: var(--bg-soft); color: var(--green);
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #pg-output::-webkit-scrollbar { width: 6px; height: 6px; }
  #pg-output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  #pg-output::-webkit-scrollbar-track { background: transparent; }
  pre[data-playground] { position: relative; }
  .pg-open-btn {
    position: absolute; top: 8px; right: 8px;
    background: rgba(88,166,255,.15); color: var(--accent);
    border: 1px solid rgba(88,166,255,.4); border-radius: 6px;
    font-size: 11px; font-weight: 700; font-family: inherit;
    padding: 3px 10px; cursor: pointer; opacity: .85;
  }
  .pg-open-btn:hover { background: var(--accent); color: #0d1117; opacity: 1; }
  /* 窄屏时面板退化为浮层 */
  @media (max-width: 1400px) {
    #pg-panel {
      position: fixed; right: 0; top: 0; z-index: 100;
      width: min(480px, 92vw); box-shadow: -8px 0 24px rgba(0,0,0,.5);
    }
  }
  .kbd { font-family: monospace; background: var(--bg-code); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; font-size: 12px; }
  .article a { color: var(--accent); text-decoration: none; }
  .article a:hover { text-decoration: underline; }

  #nav-backdrop { display: none; }
  @media (max-width: 860px) {
    /* 手机端：侧边栏改为抽屉式浮层，默认收起，点击展开按钮滑出 */
    aside {
      position: fixed; left: 0; top: 0; z-index: 90;
      width: min(300px, 85vw); height: 100vh; height: 100dvh;
      transform: translateX(-105%);
      transition: transform .25s ease;
      box-shadow: 8px 0 24px rgba(0,0,0,.5);
    }
    aside.collapsed { display: block; }
    aside.mobile-open { transform: none; }
    main { padding: 24px 20px 80px; }
    /* 展开按钮在手机端始终可见，作为打开抽屉的入口 */
    #nav-show {
      top: 12px; transform: none;
      width: 36px; height: 36px; font-size: 18px;
    }
    #nav-show:hover { width: 36px; }
    #nav-show.hidden { display: flex; }
    #nav-backdrop {
      display: block;
      position: fixed; inset: 0; z-index: 85;
      background: rgba(0,0,0,.5);
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    #nav-backdrop.show { opacity: 1; pointer-events: auto; }

    /* ---- 手机端可读性 ---- */
    body { font-size: 17px; line-height: 1.8; }
    p { margin: 14px 0; }
    ul, ol { margin: 14px 0 14px 22px; }
    li { margin: 10px 0; }
    .lesson-header { margin-bottom: 40px; }
    .lesson-tag { font-size: 13px; }
    .lesson-header h2 { font-size: 26px; margin: 10px 0 12px; }
    .lesson-header .meta { font-size: 14px; }
    h3 { font-size: 22px; margin: 48px 0 18px; padding-top: 28px; }
    h4 { font-size: 18px; margin: 32px 0 12px; }
    code { font-size: 15px; }
    pre { font-size: 14px; line-height: 1.75; padding: 18px 20px; border-radius: 10px; }
    .pre-wrap { margin: 18px 0; }
    .file-ref { font-size: 13px; }
    .callout { font-size: 15.5px; padding: 14px 18px; margin: 20px 0; }
    table { font-size: 15px; margin: 18px 0; }
    th, td { padding: 10px 12px; }
    th { font-size: 14px; }
    td { font-size: 14.5px; }
    /* 抽屉内导航项：字号更大、点击区域更大 */
    .nav-item { padding: 14px 20px; }
    .nav-item .nav-title { font-size: 15.5px; }
    .nav-item .nav-sub { font-size: 13px; margin-top: 4px; }
    /* 测验 / 作业 / 按钮随正文放大 */
    .quiz { padding: 18px 22px; }
    .quiz-q .q-text { font-size: 15px; }

<script>
// ===================== 课程数据 =====================
const LESSONS = [
  // ============================================================
  // 第 1 课：TypeScript 速成
  // ============================================================
  {
    id: "lesson-ts",
    title: "第 1 课 · TypeScript 速成",
    sub: "以 Python 开发者的视角",
    html: `
<div class="lesson-header">
  <div class="lesson-tag">LESSON 01</div>
  <h2>TypeScript 速成：以 Python 开发者的视角</h2>
  <div class="meta">目标：能流畅阅读 pi 源码 · 不是学会"写漂亮的 TS"，而是建立阅读词汇</div>
</div>

<div class="callout key">
  <strong>最重要的一句话：</strong>TypeScript = JavaScript + 一层只在编译期存在的类型注解。
  类型检查通过后会被<strong>全部擦除</strong>，运行时一行类型都不剩。
  所以 TS 的类型不能校验运行时数据（比如网络返回的 JSON），这一点和 Python 的 pydantic 完全不同，后面会反复强调。
</div>

<h3 id="ts-s1"><div class="section-head">1 · 模块与变量 <button class="done-btn" data-section="ts-s1">标记完成</button></div></h3>

<p>TS 的模块系统和 Python 几乎一一对应：</p>
<div class="pair">
  <div class="cell"><span class="lang py">PYTHON</span><pre><code># agent_loop.py
from .types import AgentContext, AgentEvent
from .stream_fn import get_default_stream_fn

MAX_RETRIES = 3
result = None</code></pre></div>
  <div class="cell"><span class="lang ts">TYPESCRIPT</span><pre><code>// agent-loop.ts
import { type AgentContext, type AgentEvent } from "./types.ts";
import { getDefaultStreamFn } from "./stream-fn.ts";

const MAX_RETRIES = 3;
let result = null;</code></pre></div>
</div>
<ul>
  <li><code>const</code> ≈ Python 的"约定不改的变量"（≈ 没有 <code>final</code> 时的习惯），<code>let</code> ≈ 普通变量。<strong>永远不用 <code>var</code></strong>（历史遗留）。</li>
  <li><code>import { type X }</code> 里的 <code>type</code> 关键字表示"只导入类型，运行时不导入"——因为类型编译后会被擦除。</li>
  <li>注意 pi 的 import 路径带 <code>.ts</code> 后缀（<code>"./stream-fn.ts"</code>）。这是 Node 的"strip types"新模式：直接运行 TS 源码，类型当注释删掉。多数项目写 <code>"./stream-fn"</code>，本仓库特殊。</li>
  <li>每个文件就是一个模块，<code>export</code> 什么别人才能 import 什么——比 Python 的"下划线约定"严格。</li>
  <li>相等比较用 <code>===</code>（严格相等，无隐式类型转换），<strong>永远不用 <code>==</code></strong>。Python 没有对应的坑，记住即可。</li>
</ul>

<h3 id="ts-s2b"><div class="section-head">2 · 常用数据类型声明：数组、字典、集合 <button class="done-btn" data-section="ts-s2b">标记完成</button></div></h3>

<p>好消息：声明大多能省略（编译器从字面量推断）。你真正要学的是"需要写的时候怎么写"和"运行时怎么判断"。</p>

<h4>数组 ≈ list</h4>
<div class="pair">
  <div class="cell"><span class="lang py">PYTHON</span><pre><code>names: list[str] = ["a", "b"]
mixed: list[str | int] = ["a", 1]
grid: list[list[int]] = [[1, 2], [3]]</code></pre></div>
  <div class="cell"><span class="lang ts">TYPESCRIPT</span><pre><code>const names: string[] = ["a", "b"];          // 后缀 []
const mixed: (string | number)[] = ["a", 1]; // union 数组要加括号！
const grid: number[][] = [[1, 2], [3]];
// Array&lt;string&gt; 也完全等价，但 [] 更常见
// 实际代码通常不标注：const names = ["a", "b"];
// 编译器自动推断为 string[]</code></pre></div>
</div>

<h4>字典：两种形态，别混用</h4>
<p><strong>形态 1：字段名已知</strong> → interface + 对象字面量（第 2 节的内容）。<strong>形态 2：键名运行时才确定</strong> → <code>Record</code> 或 <code>Map</code>：</p>
<div class="pair">
  <div class="cell"><span class="lang py">PYTHON</span><pre><code>counts: dict[str, int] = {}
counts["a.wav"] = 3

by_id: dict[int, str] = {}
by_id[1] = "kick.wav"</code></pre></div>
  <div class="cell"><span class="lang ts">TYPESCRIPT</span><pre><code>const counts: Record&lt;string, number&gt; = {};
counts["a.wav"] = 3;

// 需要非字符串键 → 用 Map（dict 的完整对应物）
const byId = new Map&lt;number, string&gt;();
byId.set(1, "kick.wav");
byId.get(1);   // "kick.wav"
byId.has(2);   // false</code></pre></div>
</div>
<div class="callout warn">
  <strong>对象当字典用的坑：</strong>JS 对象的键<strong>永远被转成字符串</strong>——<code>obj[1]</code> 存的其实是 <code>"1"</code>。
  Map 保留键的原始类型。规则：键是固定字段用对象/interface，键是动态数据用 Map。
</div>

<h4>集合 ≈ set</h4>
<div class="pair">
  <div class="cell"><span class="lang py">PYTHON</span><pre><code>seen: set[str] = set()
seen.add("a.wav")
"a.wav" in seen        # True
list(seen)             # 转回列表
list({"x", "y", "x"})  # 去重</code></pre></div>
  <div class="cell"><span class="lang ts">TYPESCRIPT</span><pre><code>const seen = new Set&lt;string&gt;();
seen.add("a.wav");
seen.has("a.wav");      // true
[...seen];              // 转回数组
[...new Set(["x", "y", "x"])];  // 数组去重一行流</code></pre></div>
</div>

<h4>元组 ≈ tuple（定长、每位置类型固定）</h4>
<div class="pair">
  <div class="cell"><span class="lang py">PYTHON</span><pre><code>point: tuple[int, int] = (120, -6)</code></pre></div>
  <div class="cell"><span class="lang ts">TYPESCRIPT</span><pre><code>const point: [number, number] = [120, -6];
// 普通数组 = 同种元素任意长度；元组 = 定长异构</code></pre></div>
</div>

<h4>运行时判断类型的坑（typeof 家族）</h4>
<div class="pre-wrap"><pre data-playground><code>console.log(typeof []);         // "object"  ← 坑！
console.log(typeof {});         // "object"
console.log(typeof null);       // "object"  ← JS 著名历史 bug
console.log(typeof "a");        // "string"
console.log(typeof 1);          // "number"
console.log(typeof undefined);  // "undefined"

// 判断数组必须用 Array.isArray：
console.log(Array.isArray([])); // true
console.log(Array.isArray({})); // false</code></pre></div>

<h4>速查表</h4>
<table>
  <tr><th>需求</th><th>Python</th><th>TypeScript</th></tr>
  <tr><td>数组</td><td><code>list[str]</code></td><td><code>string[]</code> / <code>Array&lt;string&gt;</code></td></tr>
  <tr><td>动态键字典</td><td><code>dict[str, int]</code></td><td><code>Record&lt;string, number&gt;</code> 或 <code>Map&lt;string, number&gt;</code></td></tr>
  <tr><td>集合</td><td><code>set[str]</code></td><td><code>Set&lt;string&gt;</code></td></tr>
  <tr><td>定长异构</td><td><code>tuple[str, int]</code></td><td><code>[string, number]</code></td></tr>
  <tr><td>取默认值</td><td><code>d.get(k, 0)</code></td><td><code>obj[k] ?? 0</code> / <code>map.get(k) ?? 0</code></td></tr>
  <tr><td>遍历字典</td><td><code>d.items()</code></td><td><code>Object.entries(obj)</code> / <code>map.entries()</code></td></tr>
  <tr><td>遍历键 / 值</td><td><code>d.keys()</code> / <code>d.values()</code></td><td><code>Object.keys(obj)</code> / <code>Object.values(obj)</code></td></tr>
</table>

<p><strong>亲手试一下</strong>（≈ Python 的 <code>collections.Counter</code> 和 dict 键类型坑，点"▶ 试一试"。里面的 <code>for...of</code> ≈ Python 的 <code>for...in</code>，先直觉使用，第 8 节系统讲）：</p>
<div class="pre-wrap"><pre data-playground><code>// ≈ Counter：统计素材出现次数
const counts: Record&lt;string, number&gt; = {};
for (const name of ["a.wav", "b.wav", "a.wav"]) {
  counts[name] = (counts[name] ?? 0) + 1;  // ?? 0 ≈ dict.get(name, 0)
}
console.log("计数:", counts);

// 对象键被转成字符串的现场
const obj: Record&lt;string, string&gt; = {};
obj[1] = "one";   // 你写的是数字 1…
console.log("对象的键:", Object.keys(obj), typeof Object.keys(obj)[0]);

// Map 保留键的类型
const map = new Map();
map.set(1, "one");
console.log("Map 的键:", [...map.keys()], typeof [...map.keys()][0]);

// 实验：把 counts 换成 Map 重写一遍（set/get/has），体会两种写法的差异</code></pre></div>

<h3 id="ts-s2"><div class="section-head">3 · 对象、interface 与结构类型 <button class="done-btn" data-section="ts-s2">标记完成</button></div></h3>

<p>JS 的对象字面量 ≈ Python 的 dict，但键不用引号，访问统一用点号：</p>
<div class="pair">
  <div class="cell"><span class="lang py">PYTHON</span><pre><code>msg = {
    "role": "user",
    "content": "你好",
    "timestamp": 1717000000000,
}
print(msg["role"])</code></pre></div>
  <div class="cell"><span class="lang ts">TYPESCRIPT</span><pre><code>const msg = {
  role: "user",
  content: "你好",
  timestamp: 1717000000000,
};
console.log(msg.role);</code></pre></div>
</div>

<p><code>interface</code> 描述对象的"形状"。它最接近 Python 的 <code>TypedDict</code> 或 <code>@dataclass</code>，但有一个本质区别——<strong>结构类型</strong>：</p>
<div class="pair">
  <div class="cell"><span class="lang py">PYTHON（名义类型）</span><pre><code>class UserMessage(BaseModel):
    role: str
    content: str
    timestamp: int

# 必须是 UserMessage 的实例
# 才算 UserMessage</code></pre></div>
  <div class="cell"><span class="lang ts">TYPESCRIPT（结构类型）</span><pre><code>interface UserMessage {
  role: "user";
  content: string | (TextContent | ImageContent)[];
  timestamp: number;  // 毫秒 Unix 时间戳
}

// 任何"形状吻合"的对象都算 UserMessage，
// 不需要 new、不需要继承</code></pre></div>
</div>
<p>上面这段是 <span class="file-ref">packages/ai/src/types.ts</span> 里的真实代码。要点：</p>
<ul>
  <li><code>role: "user"</code> —— 类型不是 <code>string</code>，而是<strong>字面量 "user" 本身</strong>。这个字段只能是这个字符串。这是 TS 类型系统最好用的武器，下一节详讲。</li>
  <li><code>|</code> 是"或"（union），≈ Python 3.10+ 的 <code>str | list[...]</code>。</li>
  <li><code>(TextContent | ImageContent)[]</code> —— 后缀 <code>[]</code> 表示数组，≈ <code>list[TextContent | ImageContent]</code>。</li>
  <li>可选字段用 <code>?</code>：<code>textSignature?: string</code> 表示这个字段可以不存在（不是 <code>string | None</code>，是"键可以整个缺失"）。</li>
</ul>

<div class="callout">
  <strong>结构类型 vs 名义类型</strong>是 TS 和 Python(pydantic/mypy) 思维最大的差异：
  TS 里"鸭子类型"是官方特性——形状对就是同一类型，跟类名无关。所以 pi 源码里很少见到 class，全是 interface + 对象字面量。
</div>

<h4>追问：什么叫"运行时不存在的形状"？（Q&A 实录）</h4>
<p>先看一个可运行的实验（保存为 demo.ts，<code>node --experimental-strip-types demo.ts</code> 直接跑）：</p>
<div class="pre-wrap"><pre data-playground><code>interface TextContent {
  type: "text";
  text: string;
}

function describe(c: TextContent): string {
  return \`[\${c.type}] \${c.text}\`;
}

// 注意：没有任何 new、没有任何类
const msg = { type: "text", text: "你好" };
console.log(describe(msg));           // → [text] 你好

// console.log(msg instanceof TextContent);
// ↑ 取消注释会【直接报错】：TextContent 只被用作类型，运行时不存在这个东西

console.log(typeof msg);  // → "object"，仅此而已</code></pre></div>

<p>这个实验说明了三件事：</p>
<ol>
  <li><strong><code>interface</code> 编译后产出 0 字节的 JavaScript。</strong>运行时没有 <code>TextContent</code>——没有类、没有构造函数、没有注册表。<code>instanceof</code> 它不是返回 false，而是语法错误：你无法对一个不存在的概念提问。</li>
  <li><strong>"形状"= 兼容性只看字段结构，不看出身。</strong><code>msg</code> 没有任何 <code>new</code>，但编译通过——编译器检查的是"有没有 <code>type</code> 和 <code>text</code> 字段、类型对不对"，不是"哪个类生的"。</li>
  <li><strong>运行时的 msg 就是个裸对象</strong>，所有类型信息在编译完成的那一刻全部蒸发。</li>
</ol>

<div class="callout">
  <strong>Python 里的同款概念：</strong><code>TypedDict</code> 也只活在 mypy 里，运行时 <code>isinstance</code> 同样报错。
  TS 的区别是：<strong>整个语言都按这个哲学设计</strong>，而不只是 TypedDict 一个角落。
</div>

<h4>再追问：这样设计有什么用？</h4>
<ul>
  <li><strong>① 给"别人家的数据"贴类型标签。</strong>JS 世界的数据大多以 JSON 流动（HTTP 响应、配置文件、<strong>LLM 返回的消息</strong>），来自 <code>JSON.parse()</code>，没法要求它们 <code>instanceof</code> 你的类。结构类型让你依然能精确描述：<code>AssistantMessage</code> 描述的正是 LLM API 返回的 JSON 形状，parse 完直接当它用。</li>
  <li><strong>② 零成本。</strong>pi 的 <span class="file-ref">types.ts</span> 有 815 行类型定义，编译后贡献的运行时代码是<strong>零</strong>。对比 pydantic：每个模型都是真实的运行时类，有开销、有构造逻辑。</li>
  <li><strong>③ 解耦。</strong>函数声明"我要一个 <code>{ name: string }</code>"，任何人都能传，不需要继承同一个基类。pi 的 JS 扩展系统能工作就靠这个：你的扩展产出一个形状吻合的对象，就是合法工具。</li>
  <li><strong>④ 测试友好。</strong>测试里直接写对象字面量就是合法 <code>UserMessage</code>，不用 mock 框架。</li>
</ul>

<h4>精确化一个常见表述</h4>
<div class="callout warn">
  <strong>"interface 不会编译成真的 JS 类型，只是 TS 层面编排数据的语法"——对了一半：</strong>
  <ol style="margin-top:8px">
    <li>不是"选择不编译"，而是 <strong>JS 运行时根本没有"类型"可以编译过去</strong>。JS 对对象只有一个概念：<code>object</code>（一堆键值对）。interface 在 JS 世界里没有对应物，编译时只能整个丢弃。</li>
    <li>"编排数据"要小心：<strong>interface 对数据什么都不做</strong>——不创建、不整理、不在运行时管任何事。数据是对象字面量那行运行时代码产生的，和 interface 无关。interface 真正的角色是<strong>一份只给编译器看的契约</strong>。</li>
  </ol>
</div>
<div class="pre-wrap"><pre data-lang="text"><code>你写：  const msg: TextContent = { type: "text", text: "你好" };
                │
                ├─ 编译器：拿 interface 逐字段核对 → 通过 → 擦掉，放行
                │         若形状不符 → 编译报错，代码根本跑不起来
                │
                └─ 运行时：interface 已蒸发，执行的就是那个对象字面量</code></pre></div>
<div class="callout key">
  <strong>推论：</strong>运行时行为只由 JS 部分决定。读 pi 源码时，所有 <code>: Type</code>、<code>&lt;T&gt;</code>、<code>interface</code>、<code>as</code>
  都是"编译期的保安"——在脑里自动划掉它们，剩下的就是程序真正干的事。
  而边界上的运行时数据（LLM 返回、配置文件）编译器管不到，所以 pi 用 <code>validateToolArguments()</code> 在运行时守住边界：
  <strong>类型管内部，schema 管边界。</strong>
</div>

<h4>追问：type 和 interface 是什么关系？（Q&A 实录，精简版）</h4>
<p><strong>两者都只是"给类型起名字"的编译期语法（运行时都蒸发），区别只在能起名字的范围：<code>interface</code> 只能描述对象形状，<code>type</code> 能给任何类型表达式起名字。</strong></p>
<div class="pair">
  <div class="cell"><span class="lang py">PYTHON（关系一模一样）</span><pre><code># interface ≈ TypedDict：只能声明结构
class Point(TypedDict):
    x: int
    y: int

# type ≈ 类型别名：什么都能起名字
Message = UserMessage | AssistantMessage
Handler = Callable[[Event], None]
Pair = tuple[str, int]</code></pre></div>
  <div class="cell"><span class="lang ts">TYPESCRIPT（pi 真实例子）</span><pre><code>// 重叠区：对象形状，两者几乎等价
interface Point { x: number; y: number }
type Point = { x: number; y: number }

// 只有 type 能干的：
type StopReason = "stop" | "length" | "error";  // union
type Message = UserMessage | AssistantMessage | ToolResultMessage;
type AgentEventSink = (e: AgentEvent) =&gt; Promise&lt;void&gt; | void;  // 函数
type Pair = [string, number];  // 元组</code></pre></div>
</div>
<ul>
  <li><strong>interface 独有：</strong><code>extends</code> 继承（type 用 <code>&amp;</code> 交叉代替）、声明合并（同名 interface 自动合并字段，库作者用，认识即可）。</li>
  <li><strong>官方建议对象优先 interface：</strong>报错信息更友好（显示 <code>Point</code> 而不是展开的形状），编译略快。</li>
</ul>
<table>
  <tr><th>场景</th><th>用哪个</th></tr>
  <tr><td>对象形状（Message、Content、Config…）</td><td><code>interface</code></td></tr>
  <tr><td>union、字面量集合</td><td><code>type</code></td></tr>
  <tr><td>函数签名</td><td><code>type</code></td></tr>
  <tr><td>元组、Record/Partial 等组合</td><td><code>type</code></td></tr>
</table>
<div class="callout">
  打开 <span class="file-ref">packages/ai/src/types.ts</span> 扫一眼：所有 Message/Content 是 interface，所有 <code>Xxx = A | B | C</code> 和函数类型是 type——这个分工被执行得非常整齐。
</div>

<h4>再追问：给泛型填参的结果起名，为什么只能用 type？</h4>
<p>比如 <code>type ReadResult = ToolResultMessage&lt;{ lines: number }&gt;</code>。因为 <strong>interface 没有"等于某个已有类型"的语法</strong>——它只能从零声明一个带字段的新形状，没有 <code>=</code> 形式。<code>interface ReadResult = ToolResultMessage&lt;...&gt;</code> 是语法错误。</p>
<div class="pre-wrap"><pre><code>// 想表达"给已有类型表达式贴个名字"（别名）→ 只能 type
type ReadResult = ToolResultMessage&lt;{ lines: number }&gt;;   // A 就是 B

// interface 的唯一近似写法是继承，但语义变了：
interface ReadResult2 extends ToolResultMessage&lt;{ lines: number }&gt; {}
// 读作"ReadResult2 是一种 ToolResultMessage"（声明子类型），
// 而不是"它就是那个东西"。而且更啰嗦，union 还根本接不住：
// type Message = UserMessage | AssistantMessage  ← interface 无任何对应写法</code></pre></div>
<div class="callout key">
  <strong>记忆法：interface 是"声明"，type 是"命名"。</strong>
  interface 必须自己长出一个新形状；type 可以给任何现成的东西——union、函数、元组、填好参数的泛型——贴标签。
</div>

<h3 id="ts-s9"><div class="section-head">4 · 解构与展开 <button class="done-btn" data-section="ts-s9">标记完成</button></div></h3>

<p><strong>解构 = 把数组/对象里的值"拆包"到独立变量，一步完成。</strong>数组版你在 Python 里天天用（<code>a, b = point</code>）；对象版是 TS 的重点，因为 Python 没有直接对应物。</p>

<h4>① 数组解构：按位置拆 ≈ Python 元组解包</h4>
<div class="pair">
  <div class="cell"><span class="lang py">PYTHON</span><pre><code>x, y = point
first, *rest = items
_, _, third = arr
a, b = b, a          # 交换</code></pre></div>
  <div class="cell"><span class="lang ts">TYPESCRIPT</span><pre><code>const [x, y] = point;
const [first, ...rest] = items;
const [, , third] = arr;   // 跳过前两个
[a, b] = [b, a];           // 交换</code></pre></div>
</div>

<h4>② 对象解构：按字段名拆（Python 没有对应物）</h4>
<div class="pre-wrap"><pre data-playground><code>const config = { model: "gpt-5", apiKey: "sk-x", reasoning: "high" };

// 按名拆包，顺序无关（不是按位置！）
const { model, apiKey } = config;
console.log(model, apiKey);

// 重命名：把 model 字段拆到 current 变量
const { model: current } = config;
console.log(current);

// 字段可能不存在 → 默认值
const { temperature = 1.0 } = config;
console.log(temperature);   // 1.0（config 里没有这个字段）</code></pre></div>
<div class="callout warn">
  <strong>坑 1：</strong>对 null/undefined 解构直接抛错 <code>TypeError</code>。防御写法：<code>const { a } = maybeObj ?? {}</code>。<br>
  <strong>坑 2：</strong>拼错字段名不报错，只是得到 <code>undefined</code>——配默认值或靠类型系统抓。
</div>

<h4>③ 函数参数解构：JS 的 kwargs（最重要的用途）</h4>
<p>Python 有关键字参数，<strong>JS 没有</strong>——它用"传一个对象 + 参数处解构"来模拟：</p>
<div class="pair">
  <div class="cell"><span class="lang py">PYTHON</span><pre><code>def download(url, *, retries=3, timeout=10):
    ...

download(url, timeout=30)</code></pre></div>
  <div class="cell"><span class="lang ts">TYPESCRIPT</span><pre><code>function download(url, { retries = 3, timeout = 10 } = {}) {
  console.log(url, retries, timeout);
}

download("a.wav", { timeout: 30 });</code></pre></div>
</div>
<p>pi 源码里的真实例子（agent-loop.ts）：</p>
<div class="pre-wrap"><pre><code>await config.shouldStopAfterTurn?.({
  message,        // ← 对象简写：{ message } 等价于 { message: message }
  toolResults,    //    解构的逆运算：把变量按名打包成对象
  context: currentContext,
  newMessages,
});
// 调用处用简写【打包】成对象，接收方在参数里【解构】取出——传参的日常</code></pre></div>

<h4>④ 其他高频用途</h4>
<div class="pre-wrap"><pre><code>// 多返回值 ≈ Python return tuple
function analyze(audio) { return { loudness: -14, peak: -1 }; }
const { loudness, peak } = analyze(x);   // 调用处拆开，只取要的

// 循环头（第 8 节见过）
for (const [name, n] of Object.entries(counts)) { }  // ≈ for name, n in d.items()

// 从大对象只取需要的字段：签名即文档
function stream({ model, apiKey, signal }) { /* 只用这三个字段 */ }</code></pre></div>

<h4>追问：{ ...old, key: newVal } 是"不可变更新"的标准写法，是什么意思？（Q&A 实录）</h4>
<p>拆开这句话：<code>...</code> 是展开，整句的意思是"<strong>复制 old 的所有字段，再覆盖 key，产出一个新对象；old 本身一个字节都没动</strong>"：</p>
<div class="pre-wrap"><pre data-playground><code>const oldConfig = { model: "gpt-5", reasoning: "high" };

// 对照组·可变更新（mutate）：原地改
const a = oldConfig;
a.model = "claude";
console.log("oldConfig.model 被悄悄改成:", oldConfig.model);  // "claude"！

// 不可变更新：复制 + 覆盖，原对象不动
const newConfig = { ...oldConfig, reasoning: "low" };
console.log("oldConfig.reasoning 仍是:", oldConfig.reasoning);  // "high"
console.log("newConfig.reasoning:", newConfig.reasoning);        // "low"
console.log("是同一个对象吗:", newConfig === oldConfig);         // false</code></pre></div>
<p>为什么"不原地改"值得成为一种标准写法？三个理由：</p>
<ol>
  <li><strong>共享引用的可预测性。</strong>多个模块持有同一个对象时，任何一处原地改，其他持有者看到的是"闹鬼"的变化。不可变更新让旧引用永远指向旧数据——≈ Python 的 <code>dataclasses.replace()</code> / <code>dict | {...}</code> 的哲学。</li>
  <li><strong>变化检测：=== 就够了。</strong>不可变数据里"变了没"等价于"引用换了没"（<code>newConfig === oldConfig</code> 为 false 就是变了）。<strong>React 就是靠这个决定要不要重渲染的</strong>：<code>setConfig({ ...config, model })</code> 触发重渲染；原地改再 <code>setConfig(config)</code>，引用没变，React 认为无事发生——这是 React 新手最高频的 bug。你将来写 Electron UI 会天天用。</li>
  <li><strong>历史可追溯。</strong>旧对象没被销毁，天然支持撤销/快照/事件溯源。</li>
</ol>
<p><strong>再追问：上面说的 setConfig 是什么？</strong>它是 React 的状态更新函数，来自 React 最核心的 API <code>useState</code>：</p>
<div class="pre-wrap"><pre><code>// const [状态值, 状态更新函数] = useState(初始值);
const [config, setConfig] = useState({ model: "gpt-5", reasoning: "high" });
// ↑ 注意：这一行本身就是解构——useState 返回 [当前值, 更新函数] 二元组，数组解构拆开</code></pre></div>
<p>React 的世界观用游戏经验类比最直观：<strong>它就是渲染循环</strong>——游戏里你不直接改像素，你改状态（血量、位置），渲染器重画；React 里你不直接改 DOM，你调 <code>setConfig(新状态)</code>，React 重渲染。<code>UI = f(state)</code>。而 React 靠<strong>引用比较</strong>判断"变了没"，所以：</p>
<div class="pre-wrap"><pre><code>setConfig({ ...config, model: "claude" });  // 新引用 → React 重渲染 ✓
config.model = "claude"; setConfig(config); // 同引用 → React 认为没变 → 界面不更新 ✗
// 第二种写法数据其实变了，界面却不更新——这就是"必须不可变更新"的完整因果链</code></pre></div>
<div class="callout key">
  <strong>记住这个形状：</strong>在 React/Electron 里，所有状态更新都是 <code>setX({ ...old, 改动的字段 })</code>。
  React 系统学习在第 5 课之后单开，现在记住 <code>UI = f(state)</code>、<code>setX</code> 触发重渲染、引用比较，就够了。
</div>
<p>pi 里的实例（agent-loop.ts 的 <code>prepareNextTurn</code>）：</p>
<div class="pre-wrap"><pre><code>config = {
  ...config,                                   // 保留旧配置所有字段
  model: nextTurnSnapshot.model ?? config.model,  // 覆盖要换的
};</code></pre></div>
<div class="callout warn">
  <strong>注意：展开是浅拷贝。</strong><code>{ ...old }</code> 只复制第一层，嵌套对象依然共享引用。
  要改嵌套字段得逐层展开：<code>{ ...old, nested: { ...old.nested, x: 1 } }</code>——嵌套深了很啰嗦，这就是 Immer 这类库存在的原因（以后遇到再说）。
</div>

<h3 id="ts-s10"><div class="section-head">5 · 空值三件套：?. ?? ! <button class="done-btn" data-section="ts-s10">标记完成</button></div></h3>

<p>先理解 JS 的两个"空"：<code>undefined</code>（没赋值/字段不存在，≈ Python 的"键不存在"）和 <code>null</code>（显式的空，≈ <code>None</code>）。历史包袱，实践中规则是：<strong>自己的代码用 undefined，遇到 null 当 undefined 处理</strong>。</p>

<div class="pre-wrap"><pre><code>// ① 可选链 ?. —— 链上任何一环是 null/undefined，整体短路为 undefined
config.getSteeringMessages?.()
// ≈ Python: fn(config) if (fn := getattr(config, 'get_steering_messages', None)) else None

// ② 空值合并 ?? —— 只对 null/undefined 生效
afterResult.content ?? result.content
// ≈ Python: after.content if after.content is not None else result.content

// ③ 非空断言 ! —— 跟编译器说"我保证这不是空"，编译器放行，运行时出事自己负责
// pi 源码里很少用，你写的时候也尽量不用</code></pre></div>

<div class="callout danger">
  <strong>?? vs ||（高频 bug）：</strong><code>a || b</code> 在 <code>a</code> 是 <code>0</code>、<code>""</code>、<code>false</code> 时也会取 b；
  <code>a ?? b</code> 只在 <code>a</code> 是 null/undefined 时取 b。
  Python 的 <code>or</code> 是前者的语义。处理数字（音量、时长、采样率！）时用错就是事故。pi 源码几乎只用 <code>??</code>。
</div>

<h3 id="ts-s6"><div class="section-head">6 · 函数：箭头函数与函数类型 <button class="done-btn" data-section="ts-s6">标记完成</button></div></h3>

<div class="pair">
  <div class="cell"><span class="lang py">PYTHON</span><pre><code># 普通函数
def emit(event: AgentEvent) -> None:
    ...

# lambda
square = lambda x: x * x

# 函数作为类型
EmitFn = Callable[[AgentEvent], None]</code></pre></div>
  <div class="cell"><span class="lang ts">TYPESCRIPT</span><pre><code>// 普通函数
function emit(event: AgentEvent): void { ... }

// 箭头函数（两种写法）
const square = (x) =&gt; x * x;        // 单行，自动 return
const emit = (event) =&gt; {           // 多行，需要显式 return
  stream.push(event);
};

// 函数作为类型（agent-loop.ts 真实代码）
export type AgentEventSink =
  (event: AgentEvent) =&gt; Promise&lt;void&gt; | void;</code></pre></div>
</div>
<ul>
  <li>箭头函数和 <code>lambda</code> 的区别：可以是多行的（用 <code>{}</code> 包起来），并且 JS 里函数是一等公民的程度比 Python 更高——源码里 90% 的"函数"都是箭头函数。</li>
  <li>参数类型注解写在参数后面：<code>(event: AgentEvent)</code>。返回值类型写在参数列表后：<code>: void</code>。多数时候返回值类型可以省略，编译器会推断。</li>
  <li><code>Promise&lt;void&gt; | void</code> 读作"返回 Promise 或直接不返回都行"——调用方都会 <code>await</code>，两种都能正常工作（<code>await</code> 一个非 Promise 值是合法的）。</li>
</ul>

<h4>追问：什么叫"一等公民"？（Q&A 实录，精简版）</h4>
<p>说一个东西是语言的一等公民，指它享有完整的"值"的权利：① 赋值给变量 ② 作为参数传递 ③ 作为返回值 ④ 存进数据结构 ⑤ 运行时匿名创建。函数在 TS 里五项全有：</p>
<div class="pre-wrap"><pre><code>const f = (x) =&gt; x * 2;                          // ① 赋值给变量
arr.map((x) =&gt; x * 2);                           // ② 作为参数传递
function makeAdder(n) { return (x) =&gt; x + n; }   // ③ 作为返回值
const handlers = { click: () =&gt; save() };        // ④ 存进数据结构
setTimeout(() =&gt; { save(); }, 100);              // ⑤ 匿名创建，随用随造</code></pre></div>
<p><strong>那 Python 函数不也是一等公民吗？</strong>是，权利清单打平。差异在密度：Python 的 <code>lambda</code> 只能是单行表达式，多行逻辑被迫 <code>def</code> 起名；JS 的箭头函数可以多行，匿名逻辑随用随造：</p>
<div class="pre-wrap"><pre><code>// JS：多行匿名函数就地创造，永远不用被迫起名
const hasSeq = calls.some((tc) =&gt; {
  const tool = tools.find((t) =&gt; t.name === tc.name);
  return tool?.executionMode === "sequential";
});</code></pre></div>
<div class="callout key">
  <strong>结论：</strong>JS 让匿名函数拥有完整表达力（多行体），于是"把行为当值传来传去"从技巧变成了这门语言的默认编程方式——
  数组方法、事件、异步、React 渲染全是回调。pi 源码"每三行一个小函数"的观感，就是这个设计哲学的直接后果。
</div>

<h3 id="ts-s5"><div class="section-head">7 · 数组的函数式方法 <button class="done-btn" data-section="ts-s5">标记完成</button></div></h3>

<p>Python 的列表推导式，在 TS 里是方法链：</p>
<div class="pair">
  <div class="cell"><span class="lang py">PYTHON</span><pre><code># 找出所有 toolCall，取出 name
names = [c.name for c in content
         if c.type == "toolCall"]

# 有没有名为 edit 的工具？
has_edit = any(t.name == "edit" for t in tools)

# 按名字找工具
tool = next((t for t in tools
             if t.name == call.name), None)</code></pre></div>
  <div class="cell"><span class="lang ts">TYPESCRIPT</span><pre><code>// filter + map（agent-loop.ts 真实代码）
const names = content
  .filter((c) =&gt; c.type === "toolCall")
  .map((c) =&gt; c.name);

// some
const hasEdit = tools.some((t) =&gt; t.name === "edit");

// find（找不到返回 undefined，不是抛异常）
const tool = tools.find((t) =&gt; t.name === call.name);</code></pre></div>
</div>
<ul>
  <li>对照表：<code>filter</code> ≈ 推导式的 if 部分，<code>map</code> ≈ 表达式部分，<code>some</code> ≈ <code>any()</code>，<code>every</code> ≈ <code>all()</code>，<code>find</code> ≈ <code>next(..., None)</code>，<code>forEach</code> ≈ for 循环。</li>
  <li><code>(c) =&gt; c.type === "toolCall"</code> 是箭头函数，上一节刚学。</li>
</ul>

<h4>追问：some / every / find 详解（Q&A 实录）</h4>
<p>这三个都是<strong>数组实例方法</strong>，接收一个回调（predicate），并且都<strong>短路</strong>——和 Python 的 <code>any()</code> / <code>all()</code> / <code>next(..., None)</code> 一样，一旦结果确定就立即停止遍历。</p>

<p><strong>some ↔ any()：只要有一个元素让回调返回 true，整体就是 true。</strong></p>
<div class="pair">
  <div class="cell"><span class="lang py">PYTHON</span><pre><code># any 直接对元素判"真值"
has_edit = any(t.name == "edit" for t in tools)</code></pre></div>
  <div class="cell"><span class="lang ts">TYPESCRIPT（agent-loop.ts 真实代码）</span><pre><code>const hasSequentialToolCall = toolCalls.some(
  (tc) =&gt; tools.find((t) =&gt; t.name === tc.name)?.executionMode === "sequential"
);</code></pre></div>
</div>
<ul>
  <li><strong>Python 的 <code>any()</code> 可以不带条件</strong>：<code>any([0, "", 3])</code> → <code>True</code>，直接对元素本身判真值。</li>
  <li><strong>JS 的 <code>some</code> 必须传回调</strong>，没有"裸"版本。想要真值判断得写 <code>arr.some((x) =&gt; x)</code> 或 <code>arr.some(Boolean)</code>。</li>
  <li>空数组：<code>[].some(f)</code> → <code>false</code>；<code>any([])</code> → <code>False</code>。一致。</li>
</ul>

<p><strong>every ↔ all()：所有元素都让回调返回 true，整体才是 true。</strong></p>
<div class="pair">
  <div class="cell"><span class="lang py">PYTHON</span><pre><code>def should_terminate(calls):
    return len(calls) &gt; 0 and all(
        c.result.terminate for c in calls)</code></pre></div>
  <div class="cell"><span class="lang ts">TYPESCRIPT（agent-loop.ts 真实代码）</span><pre><code>// 所有工具结果都要求 terminate，才终止整个 agent
function shouldTerminateToolBatch(finalizedCalls) {
  return finalizedCalls.length &gt; 0 &amp;&amp; finalizedCalls.every(
    (finalized) =&gt; finalized.result.terminate === true
  );
}</code></pre></div>
</div>
<div class="callout warn">
  <strong>空数组的坑（两边一致但都值得记住）：</strong><code>[].every(f)</code> → <strong><code>true</code></strong>，<code>all([])</code> → <strong><code>True</code></strong>（空真 / vacuous truth）。
  所以 pi 的代码显式加了 <code>length &gt; 0</code> 前置条件——故意防御"一批零个工具结果时意外终止"。
</div>

<p><strong>find ↔ next(..., None)：返回第一个让回调返回 true 的元素本身。</strong></p>
<div class="pair">
  <div class="cell"><span class="lang py">PYTHON</span><pre><code>tool = next((t for t in tools
             if t.name == call.name), None)
if tool is None:
    ...</code></pre></div>
  <div class="cell"><span class="lang ts">TYPESCRIPT（agent-loop.ts 真实代码）</span><pre><code>const tool = currentContext.tools?.find(
  (t) =&gt; t.name === toolCall.name
);
if (!tool) {
  return { kind: "immediate",
    result: createErrorToolResult(\`Tool ... not found\`) };
}</code></pre></div>
</div>
<ul>
  <li><strong>Python 的 <code>next(..., None)</code> 找不到时返回你指定的默认值</strong>；<strong>JS 的 <code>find</code> 找不到时固定返回 <code>undefined</code></strong>，不能自定义。想要默认值得自己接：<code>find(...) ?? defaultTool</code>。</li>
  <li>"拿元素"和"是否存在"别混用：<code>find</code> 拿元素，<code>some</code> 拿布尔。常见错误是两个各写一遍扫两次——需要元素就一次 <code>find</code> 然后判 <code>undefined</code>。</li>
</ul>

<p><strong>速查表：</strong></p>
<table>
  <tr><th>需求</th><th>Python</th><th>TypeScript</th><th>找不到/空数组时</th></tr>
  <tr><td>存在吗</td><td><code>any(p(x) for x in xs)</code></td><td><code>xs.some((x) =&gt; p(x))</code></td><td>空 → <code>false</code></td></tr>
  <tr><td>全都满足吗</td><td><code>all(p(x) for x in xs)</code></td><td><code>xs.every((x) =&gt; p(x))</code></td><td>空 → <strong><code>true</code></strong>（坑）</td></tr>
  <tr><td>拿第一个满足的元素</td><td><code>next((x for x in xs if p(x)), None)</code></td><td><code>xs.find((x) =&gt; p(x))</code></td><td>→ <code>undefined</code></td></tr>
  <tr><td>索引也要</td><td><code>next(i for i,x in enumerate(xs) if p(x))</code></td><td><code>xs.findIndex((x) =&gt; p(x))</code></td><td>→ <code>-1</code>（不是 undefined！）</td></tr>
  <tr><td>真值判断（不带条件）</td><td><code>any(xs)</code> / <code>all(xs)</code></td><td><code>xs.some(Boolean)</code> / <code>xs.every(Boolean)</code></td><td>同上</td></tr>
</table>

<p><strong>两个组合实例（都来自 pi）：</strong></p>
<div class="pre-wrap"><pre><code>// ① some 里嵌 find —— "有没有一个 toolCall，它对应的工具要求串行执行"
toolCalls.some((tc) =&gt;
  tools.find((t) =&gt; t.name === tc.name)?.executionMode === "sequential")
// 注意 ?.：find 没找到时返回 undefined，?.executionMode 安全短路成 undefined，
// undefined === "sequential" 是 false，不会炸。这是 find + 可选链的标准搭档。

// ② every 决定终止 —— "全部工具都说停才停"
// 语义比手写 for 循环准确，且短路特性保证第一个 terminate: false 就结束判断</code></pre></div>

<p><strong>亲手试一下</strong>（自带数据，点右上角"▶ 试一试"直接运行，然后改改数据观察输出）：</p>
<div class="pre-wrap"><pre data-playground><code>const tools = [
  { name: "read", executionMode: "parallel" },
  { name: "edit", executionMode: "sequential" },
  { name: "bash", executionMode: "parallel" },
];
const toolCalls = [{ name: "read" }, { name: "edit" }];

// some 里嵌 find：有没有一个 toolCall 对应串行工具？
const hasSeq = toolCalls.some((tc) =&gt;
  tools.find((t) =&gt; t.name === tc.name)?.executionMode === "sequential");
console.log("有串行工具吗:", hasSeq);

// every + some 组合：所有 toolCall 都有对应工具吗？
const allKnown = toolCalls.every((tc) =&gt;
  tools.some((t) =&gt; t.name === tc.name));
console.log("全部认识吗:", allKnown);

// find 找不到时返回 undefined，用 ?? 接默认值
console.log("找到:", tools.find((t) =&gt; t.name === "edit"));
console.log("找不到:", tools.find((t) =&gt; t.name === "xxx") ?? "没有此工具");

// 实验：把 toolCalls 里的 "edit" 改成 "xxx"，重新运行，观察三行输出怎么变</code></pre></div>

<h3 id="ts-s5b"><div class="section-head">8 · 循环：for...of 与遍历 <button class="done-btn" data-section="ts-s5b">标记完成</button></div></h3>

<h4>for...of ≈ Python 的 for...in</h4>
<div class="pair">
  <div class="cell"><span class="lang py">PYTHON</span><pre><code>for name in names:
    print(name)

for i, name in enumerate(names):
    print(i, name)</code></pre></div>
  <div class="cell"><span class="lang ts">TYPESCRIPT</span><pre><code>for (const name of names) {
  console.log(name);
}

for (const [i, name] of names.entries()) {
  console.log(i, name);
}</code></pre></div>
</div>
<div class="callout warn">
  <strong>JS 最大的循环陷阱：<code>for...in</code> 不是 Python 的 for...in！</strong>
  JS 的 <code>for...in</code> 遍历的是<strong>键（字符串索引）</strong>，不是值：<code>for (const i in ["a","b"])</code> 得到 <code>"0", "1"</code>。
  规则：<strong>遍历值永远用 <code>for...of</code>；<code>for...in</code> 基本不用</strong>（遍历对象键请用 <code>Object.keys/entries</code>）。
</div>

<h4>遍历字典 / Map</h4>
<div class="pair">
  <div class="cell"><span class="lang py">PYTHON</span><pre><code>for name, n in counts.items():
    print(name, n)</code></pre></div>
  <div class="cell"><span class="lang ts">TYPESCRIPT</span><pre><code>// 普通对象：Object.entries ≈ .items()
for (const [name, n] of Object.entries(counts)) {
  console.log(name, n);
}
// Map 本身直接可迭代（比对象顺手）
for (const [name, n] of map) { ... }</code></pre></div>
</div>
<p><code>while</code>、C 风格 <code>for (let i = 0; i &lt; n; i++)</code>、<code>break</code>/<code>continue</code> 和 Python 一样，不展开。</p>

<h4>什么时候用循环，什么时候用 map/filter</h4>
<p>经验法则：<strong>要新数组（数据转换）用 map/filter；做事（副作用：日志、写文件、逐个 await）用 for...of</strong>。
循环里涉及 <code>await</code> 的调度问题（串行 vs 并行，差异巨大）放到第 2 课（异步编程）实测——需要先建立 Promise 的认知。</p>

<h4>for...of 底下的机制：迭代器协议 ≈ Python 的 __iter__/__next__</h4>
<div class="pre-wrap"><pre data-playground><code>const it = ["a", "b"][Symbol.iterator]();   // ≈ it = iter(arr)
console.log(it.next());  // { value: "a", done: false }        ≈ next(it)
console.log(it.next());  // { value: "b", done: false }
console.log(it.next());  // { value: undefined, done: true }   ≈ StopIteration</code></pre></div>
<p>任何实现了 <code>[Symbol.iterator]()</code> 的对象都能被 <code>for...of</code> 和 <code>[...展开]</code> 消费——数组、Set、Map、字符串。生成器（第 2 课会讲）也实现了它，所以生成器可以直接被遍历。</p>

<h3 id="ts-s3"><div class="section-head">9 · Union 与判别联合（全仓库最重要的模式）<button class="done-btn" data-section="ts-s3">标记完成</button></div></h3>

<p>先看两个真实定义（<span class="file-ref">packages/ai/src/types.ts</span>）：</p>
<div class="pre-wrap"><pre><code>// 字面量 union：取值只能是这几个字符串之一
export type StopReason = "pending" | "stop" | "length" | "toolUse" | "error" | "aborted";
// ≈ Python: StopReason = Literal["pending", "stop", "length", ...]</code></pre></div>

<p>然后是重头戏——<strong>判别联合（discriminated union）</strong>。assistant 消息的 content 是三种内容块的 union，每块都有一个 <code>type</code> 字面量字段当"标签"：</p>
<div class="pre-wrap"><pre><code>export interface TextContent {
  type: "text";          // ← 标签
  text: string;
  textSignature?: string;
}

export interface ThinkingContent {
  type: "thinking";      // ← 标签
  thinking: string;
  redacted?: boolean;
}

export interface ToolCall {
  type: "toolCall";      // ← 标签
  id: string;
  name: string;
  arguments: Record&lt;string, any&gt;;
}

// AssistantMessage.content 的类型：
(TextContent | ThinkingContent | ToolCall)[]</code></pre></div>

<p>对照 Python，你大概会这样写：</p>
<div class="pair">
  <div class="cell"><span class="lang py">PYTHON</span><pre><code>@dataclass
class TextContent:
    type: Literal["text"]
    text: str

@dataclass
class ToolCall:
    type: Literal["toolCall"]
    id: str
    name: str
    arguments: dict[str, Any]

Content = Union[TextContent, ThinkingContent, ToolCall]</code></pre></div>
  <div class="cell"><span class="lang ts">说明</span><pre><code>// 完全同构。区别只在：
// 1. TS 用对象字面量直接构造，不用 new
// 2. TS 里这是"形状"，运行时不存在类
//
// 构造一个 TextContent：
const c: TextContent = { type: "text", text: "hi" };</code></pre></div>
</div>

<h3 id="ts-s4"><div class="section-head">10 · 类型收窄（narrowing）：联合类型的打开方式 <button class="done-btn" data-section="ts-s4">标记完成</button></div></h3>

<p>有了判别联合，怎么"解包"？检查标签字段，TS 会<strong>自动收窄</strong>类型。这是 <span class="file-ref">agent-loop.ts</span> 里的真实代码：</p>
<div class="pre-wrap"><pre><code>const toolCalls = message.content.filter((c) =&gt; c.type === "toolCall");
//                                         ↑ 只看这个判断
// 在 === "toolCall" 为真的分支里，c 自动从 union 收窄成 ToolCall，
// 可以安全访问 c.name、c.arguments，编译器保证字段存在</code></pre></div>

<div class="pair">
  <div class="cell"><span class="lang py">PYTHON (3.10+ match)</span><pre><code>match event:
    case {"type": "text"}:
        print(event["text"])
    case {"type": "toolCall"}:
        run_tool(event["name"])</code></pre></div>
  <div class="cell"><span class="lang ts">TYPESCRIPT (switch)</span><pre><code>switch (event.type) {
  case "text":
    console.log(event.text);  // 收窄为 TextContent
    break;
  case "toolCall":
    runTool(event.name);      // 收窄为 ToolCall
    break;
}</code></pre></div>
</div>

<p>你在 <code>streamAssistantResponse</code> 里看到的大 <code>switch (event.type)</code> 就是在做模式匹配。TS 还有检查<strong>穷尽性</strong>的能力：如果 union 加了新成员而 switch 没处理，可以让编译器报错——比 Python 的运行时才发现强得多。</p>

<div class="callout key">
  <strong>记住这个组合：</strong>字面量类型 + union + switch 收窄 = TS 领域建模的三件套。
  pi 里所有核心概念（Message、Content、Event、StopReason）都是这么建模的。你将来设计音频 agent 的
  领域模型（AssetContent | AnalysisResult | RenderJob…）也应该用同一套。
</div>

<h3 id="ts-s7"><div class="section-head">11 · 泛型 <button class="done-btn" data-section="ts-s7">标记完成</button></div></h3>

<p>和 Python 的 <code>Generic[T]</code> 概念相同，写法不同：</p>
<div class="pair">
  <div class="cell"><span class="lang py">PYTHON</span><pre><code>T = TypeVar("T")

class EventStream(Generic[T, R]):
    ...

def first(items: list[T]) -> T | None:
    return items[0] if items else None</code></pre></div>
  <div class="cell"><span class="lang ts">TYPESCRIPT</span><pre><code>// 真实代码：types.ts
interface ToolResultMessage&lt;TDetails = any&gt; {
  role: "toolResult";
  toolCallId: string;
  details?: TDetails;   // 每个工具自己的详情类型
  ...
}

// 带默认值的泛型参数：不写就是 any
type R1 = ToolResultMessage;             // details: any
type R2 = ToolResultMessage&lt;{bytes: number}&gt;;</code></pre></div>
</div>
<p>再比如 agent loop 的返回值类型：</p>
<div class="pre-wrap"><pre><code>EventStream&lt;AgentEvent, AgentMessage[]&gt;
//          ↑ 流里每个事件的类型   ↑ 流结束后最终 resolve 出的值类型</code></pre></div>

<p>还有几个常见的"类型工具"（≈ Python 的 <code>typing</code> 模块里的东西），见到认识即可：</p>
<table>
  <tr><th>TS</th><th>含义</th><th>Python 类比</th></tr>
  <tr><td><code>Record&lt;string, any&gt;</code></td><td>键为 string 的 dict</td><td><code>dict[str, Any]</code></td></tr>
  <tr><td><code>Partial&lt;T&gt;</code></td><td>T 的所有字段变可选</td><td>没有直接对应（≈ 所有字段默认 None 的 dataclass）</td></tr>
  <tr><td><code>unknown</code></td><td>什么都能装，但用之前必须收窄</td><td><code>Any</code> 的"安全版"（<code>object</code>）</td></tr>
  <tr><td><code>any</code></td><td>关掉类型检查</td><td><code>Any</code>（pi 仓库规则：能不用就不用）</td></tr>
</table>

<h4>追问：泛型到底是什么？（Q&A 实录，精简版）</h4>
<p><strong>一句话：泛型 = 给类型系统写的函数。</strong>普通函数接收值、返回值；泛型接收类型、算出类型。运行时照例全部蒸发。</p>
<p>它解决的问题——写一个"返回数组第一个元素"的函数，不用泛型只有两条烂路：</p>
<div class="pre-wrap"><pre data-playground><code>// 路 2：用 any → 类型信息全丢
function firstBad(items: any[]): any {
  return items[0];
}
const x = firstBad(["a", "b"]);
// x 是 any：x.toFixed(2) 编译都能过，运行时爆炸

// 泛型：输入什么数组，就返回什么元素——类型被精确追踪
function first&lt;T&gt;(items: T[]): T | undefined {
  return items[0];
}
const a = first(["a", "b"]);  // a: string（T 被推断为 string）
const b = first([1, 2, 3]);   // b: number
console.log(a, b, first([])); // 空数组 → undefined</code></pre></div>
<div class="pair">
  <div class="cell"><span class="lang py">PYTHON（你其实见过）</span><pre><code>T = TypeVar("T")

def first(items: list[T]) -&gt; T | None:
    return items[0] if items else None

# 完全同构：TypeVar ↔ &lt;T&gt;</code></pre></div>
  <div class="cell"><span class="lang ts">说明</span><pre><code>// 区别只有两个：
// 1. TS 泛型参数写在函数名后面 &lt;T&gt;
// 2. TS 推断更积极：
//    调用处几乎永远不用手写 &lt;string&gt;，
//    编译器从实参自动算出来</code></pre></div>
</div>

<p><strong>最常见的用法：给"形状"留一个插槽（pi 真实代码）</strong></p>
<div class="pre-wrap"><pre><code>// types.ts：每种工具的 details 类型不同，公共骨架只写一次
interface ToolResultMessage&lt;TDetails = any&gt; {
  role: "toolResult";
  toolCallId: string;
  details?: TDetails;   // ← 插槽
  isError: boolean;
}
type ReadResult = ToolResultMessage&lt;{ lines: number }&gt;;
type AnyResult  = ToolResultMessage;  // 不写参数 → 用默认值 any</code></pre></div>
<p>用你的音频领域类比：</p>
<div class="pre-wrap"><pre><code>interface AnalysisResult&lt;TMetrics&gt; {
  assetName: string;
  durationSec: number;
  metrics: TMetrics;  // 响度分析、频谱分析的指标结构不同
}
type LoudnessReport = AnalysisResult&lt;{ integrated: number; truePeak: number }&gt;;
type SpectrumReport = AnalysisResult&lt;{ bands: number[]; centroid: number }&gt;;</code></pre></div>
<ul>
  <li><strong>多个参数</strong>：<code>EventStream&lt;AgentEvent, AgentMessage[]&gt;</code> ≈ <code>Generic[E, R]</code>——"吐出什么事件、最终 resolve 什么值"。</li>
  <li><strong>约束 extends</strong>：<code>&lt;T extends { name: string }&gt;</code> ≈ bounded TypeVar——"不是什么类型都能装进这个插槽"。</li>
  <li><strong>推断</strong>：<code>["a"].map((x) =&gt; x.toUpperCase())</code> 里 T、U 全是编译器算的。<strong>泛型主要在定义处写，使用处靠推断。</strong></li>
</ul>
<div class="callout key">
  <strong>认知闭环：</strong><code>any</code> 是"放弃追踪"，泛型是"精确追踪类型的流动"——这就是本仓库禁用 any 的原因。
  <strong>和判别联合的分工：</strong>能枚举所有变体 → 用 union（Message 三种）；形状无限但有公共骨架 → 留泛型插槽（任意工具的 details）。
  设计自己的领域模型时先问："我能枚举所有变体吗？"
</div>

<h3 id="ts-s11"><div class="section-head">12 · 类型的真相：编译期存在，运行时消失 <button class="done-btn" data-section="ts-s11">标记完成</button></div></h3>

<p>第 3 节已经证明了核心事实：<strong>类型在编译后全部蒸发，运行时一行不剩</strong>。类型部分收尾前，本节回答它留下的两个工程问题：</p>
<ol>
  <li>编译期和运行时的"<strong>接缝</strong>"在哪里？（哪里是类型系统管不到的地方）</li>
  <li>接缝处怎么守住？（TS 给你什么工具，又哪里必须靠运行时代码）</li>
</ol>

<h4>① 接缝：外部数据进入系统的那一刻</h4>
<p>内部代码的类型由编译器保证；但有些东西<strong>运行时才进入系统</strong>，编译器对它们零了解：</p>
<div class="pre-wrap"><pre><code>const data = JSON.parse(text);   // 类型是 any：网络响应、配置文件，编译器完全不查
// LLM 返回的 tool call 参数、用户写的扩展配置——同理</code></pre></div>
<p>这些地方就是接缝。接缝两边的世界观：<strong>内部 = 类型保证；边界 = 类型只是你的愿望</strong>。</p>

<h4>② as 与 satisfies：和编译器对话的两个工具</h4>
<p>面对接缝数据，TS 提供两个编译期工具，方向正好相反：</p>
<div class="pre-wrap"><pre><code>// as（类型断言）：你跟编译器说"相信我，就是这个类型"
// ≈ Python: typing.cast(...)。不做任何运行时检查，说错了运行时自己承担
prepared.args as never   // agent-loop.ts 真实代码

// satisfies：你跟编译器说"帮我检查它符合类型，但别改变你推断出的精确类型"
const finalized = { toolCall, result, isError } satisfies FinalizedToolCallOutcome;
// 如果字段写错，编译报错；但 finalized 的类型仍按字面量精确推断，不被拉宽</code></pre></div>
<div class="callout warn">
  <strong><code>as</code> 是最容易被滥用的语法：</strong>它能通过编译不等于数据真的是那个形状——你只是关闭了检查。
  本仓库规则"能不用 any 就不用"同样适用于 <code>as</code>；确需使用时，要么紧邻运行时校验之后，要么加注释说明为什么安全。
</div>

<h4>③ 接缝处真正的防线：运行时校验</h4>
<p><code>as</code> 只是你打包票，并不能让数据变成真的。所以边界上必须有<strong>运行时代码</strong>真正检查数据：</p>
<div class="pre-wrap"><pre><code>// pi 的做法：LLM 给的 tool call 参数，先过 schema 校验再执行
const validatedArgs = validateToolArguments(tool, preparedToolCall);
// 校验失败 → 转成错误 toolResult 喂回模型（第 3 课的自愈机制）</code></pre></div>
<div class="callout key">
  <strong>类型管内部，schema 管边界。</strong>这就是 Python 世界 pydantic 干的事；TS 里常用 zod 或手写校验函数。
  设计你的音频 agent 时同理：LLM 输出的参数、用户上传的 preset 文件，进系统先过校验，然后内部代码才能放心靠类型。
</div>

<h4>④ 另一个运行时真相：catch 到的 error 没有类型</h4>
<p>JS 允许 <code>throw</code> 任意值（字符串、数字都行），所以 <code>catch</code> 到的 error 编译器无法给出类型——这又是运行时现实，处理方式是第 10 节的收窄机制：</p>
<div class="pre-wrap"><pre><code>// agent-loop.ts 真实代码（标准防御写法）
} catch (error) {
  return {
    // instanceof 在运行时把 error 收窄成 Error，才能安全访问 .message
    result: createErrorToolResult(error instanceof Error ? error.message : String(error)),
    isError: true,
  };
}
// ≈ Python: except Exception as e: ... str(e)</code></pre></div>
<p>这节和第 3 节合起来就是完整图景：<strong>编译期，类型让内部代码自洽；运行时，收窄和校验守住边界。</strong></p>

<h3 id="ts-a1"><div class="section-head">1 · 从零起步：同步、回调与第一个 async 函数 <button class="done-btn" data-section="ts-a1">标记完成</button></div></h3>

<h4>① 先理解问题：等待的时间纯属浪费</h4>
<p>用你的领域举例：批量分析 100 个素材的响度，每个要从对象存储下载，网络等待 1 秒。如果代码"下载1 → 等 1 秒 → 分析1 → 下载2 → ……"这样写，100 个素材就干等 100 秒——CPU 在等网络的时间里什么都没干。异步编程要解决的问题就是：<strong>等待别人的时候，自己别闲着。</strong></p>

<h4>② 同步代码的世界：一行接一行，等就硬等</h4>
<p>你目前写的所有代码都是同步的：一行跑完跑下一行，想"等 1 秒"只能硬耗：</p>
<div class="pre-wrap"><pre data-playground><code>function busyWait(ms) {
  const end = Date.now() + ms;
  while (Date.now() &lt; end) { /* 空转，把 CPU 占死 */ }
}

console.log("开始等");
busyWait(1000);
console.log("等完了——但这 1 秒里程序什么都干不了");</code></pre></div>
<p>这种"硬等"在浏览器里意味着页面冻结，在服务器里意味着浪费一个线程。<strong>同步代码的等待 = 占着线程什么都不干。</strong></p>

<h4>③ setTimeout：你的第一个异步 API——"登记未来，继续赶路"</h4>
<div class="pre-wrap"><pre data-playground><code>console.log("A：我先跑");
setTimeout(() =&gt; {
  console.log("B：1 秒后我才被调用");
}, 1000);
console.log("C：我不等 B，直接跑");

// 输出顺序：A → C →（1 秒后）B
// 初学者第一个反直觉时刻：C 排在 B 前面！</code></pre></div>
<p>逐句拆开看 <code>setTimeout</code> 干了什么：</p>
<ol>
  <li>它<strong>不等待</strong>。它把"1 秒后要做的那个函数"（术语叫<strong>回调 callback</strong>）登记给系统，<strong>立刻返回</strong>。</li>
  <li>你的代码继续往下跑（打印 C）。</li>
  <li>1 秒后，系统回头调用你登记的那个函数（打印 B）。</li>
</ol>
<div class="callout key">
  <strong>"登记 → 继续 → 回头执行"是全部异步编程的基本动作。</strong>后面学的 Promise、await 都是把这个动作包装得更好写，但底下都是它。
</div>

<h4>④ 回调风格的问题：嵌套地狱</h4>
<p>一件事用回调还行，几件有顺序的事就开始难看：</p>
<div class="pre-wrap"><pre><code>setTimeout(() =&gt; {
  console.log("下载完成");
  setTimeout(() =&gt; {
    console.log("分析完成");
    setTimeout(() =&gt; {
      console.log("入库完成");
    }, 300);
  }, 300);
}, 300);
// 才三步就向右倾斜了；十步、再加上每步的错误处理，就没法维护了</code></pre></div>
<p>这就是著名的"回调地狱"。我们需要一种写法：<strong>既能享受异步的不等待，读起来又像同步代码一样从上往下。</strong>这就是 async/await。</p>

<h4>⑤ 第一个 async 函数：逐行读</h4>
<div class="pre-wrap"><pre data-playground><code>// sleep(ms) 返回一个"ms 毫秒后会完成"的 Promise 对象（下一节讲透它）
const sleep = (ms) =&gt; new Promise((r) =&gt; setTimeout(r, ms));

async function main() {      // async 关键字：① 这个函数里允许用 await
                             //               ② 这个函数的返回值自动变成 Promise
  console.log("开始");
  await sleep(1000);         // await 关键字：在这里【暂停】，等 Promise 完成，
                             // 然后从这行的下一行继续
  console.log("1 秒过去了");
  await sleep(500);
  console.log("又过了 0.5 秒");
}

main();  // 调用 async 函数：立即开始跑，直到第一个 await</code></pre></div>
<p>逐条记住：</p>
<ul>
  <li><code>await</code> <strong>只能写在 async 函数里</strong>（本 Playground 的顶层是例外，它被包在一个 async 函数里）。</li>
  <li>多个 <code>await</code> <strong>顺序执行</strong>：第一个 sleep 没完，第二个不会开始。读起来和同步代码一模一样。</li>
  <li>但和同步硬等不同：<strong>暂停期间线程没有被占住</strong>——它被借去干别的活了（第 3 节你会看到这个的证据）。</li>
</ul>

<h4>⑥ 出错怎么办：try/catch，和同步代码一样</h4>
<div class="pre-wrap"><pre data-playground><code>const sleep = (ms) =&gt; new Promise((r) =&gt; setTimeout(r, ms));

async function mightFail() {
  await sleep(200);
  throw new Error("网络断了");   // async 函数里 throw → 等它的人能在 catch 里接到
}

try {
  await mightFail();
  console.log("这行不会执行");
} catch (e) {
  console.log("抓住了:", e.message);
}</code></pre></div>
<p>异步的错误处理<strong>没有第二套模型</strong>：<code>try/catch/finally</code> 原样适用。这是 await 比回调优雅的重要原因之一——回调风格里每个嵌套层都得单独传错误。</p>

<h4>⑦ 动手练习（就在 Playground 里做）</h4>
